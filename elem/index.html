<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초등 5·6학년 문제은행</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a3fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="초등 문제은행">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 과목마다 고유 색을 가진 컬러 밴드 헤더 → 그 색이 탭·OMR 버블·번호 배지·해설까지 이어지는 한 줄 시험지 */
:root{
  --bg:#f3f4f9; --sheet:#ffffff; --ink:#1b1f2e; --muted:#62697e; --rule:#e1e4ee; --chip:#f1f3f8;
  --ok:#16875a; --ok-soft:#e2f5eb; --bad:#d23b3b; --bad-soft:#fdeaea;
  --kor:#d6363c; --kor-s:#fdebea; --eng:#1f6fd1; --eng-s:#e6effd; --math:#6a3fd0; --math-s:#efe9fc;
  --sci:#12825a; --sci-s:#e0f3e9; --soc:#b45f0a; --soc-s:#fcefdf; --eth:#0a7d85; --eth-s:#ddf2f3;
  --tech:#c02f6d; --tech-s:#fbe5ef; --info:#4450c9; --info-s:#e8eafb;
  --ac:var(--math); --ac-s:var(--math-s);
  --omr:var(--ac); --omr-soft:var(--ac-s); --fill:var(--ac); --on:#ffffff;
  --shadow:0 1px 2px rgba(27,31,46,.05),0 6px 20px rgba(27,31,46,.06);
  --f-disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --sheet:#181c26; --ink:#e8eaf2; --muted:#9ca3b6; --rule:#2a3040; --chip:#212634;
  --ok:#5fd19e; --ok-soft:#143022; --bad:#ff8a84; --bad-soft:#3a1c1c;
  --kor:#ff8b8f; --kor-s:#3a1e22; --eng:#80b4ff; --eng-s:#172a45; --math:#b59dff; --math-s:#29213f;
  --sci:#5fd3a2; --sci-s:#12301f; --soc:#f4b25e; --soc-s:#36270f; --eth:#5ad0d0; --eth-s:#0f2f31;
  --tech:#ff8fbe; --tech-s:#3a1a2a; --info:#9ea6ff; --info-s:#1f2347;
  --on:#10131a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --sheet:#181c26; --ink:#e8eaf2; --muted:#9ca3b6; --rule:#2a3040; --chip:#212634;
  --ok:#5fd19e; --ok-soft:#143022; --bad:#ff8a84; --bad-soft:#3a1c1c;
  --kor:#ff8b8f; --kor-s:#3a1e22; --eng:#80b4ff; --eng-s:#172a45; --math:#b59dff; --math-s:#29213f;
  --sci:#5fd3a2; --sci-s:#12301f; --soc:#f4b25e; --soc-s:#36270f; --eth:#5ad0d0; --eth-s:#0f2f31;
  --tech:#ff8fbe; --tech-s:#3a1a2a; --info:#9ea6ff; --info-s:#1f2347;
  --on:#10131a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
:root[data-s="kor"]{--ac:var(--kor);--ac-s:var(--kor-s)}
:root[data-s="eng"]{--ac:var(--eng);--ac-s:var(--eng-s)}
:root[data-s="math"]{--ac:var(--math);--ac-s:var(--math-s)}
:root[data-s="sci"]{--ac:var(--sci);--ac-s:var(--sci-s)}
:root[data-s="soc"]{--ac:var(--soc);--ac-s:var(--soc-s)}
:root[data-s="eth"]{--ac:var(--eth);--ac-s:var(--eth-s)}
:root[data-s="tech"]{--ac:var(--tech);--ac-s:var(--tech-s)}
:root[data-s="info"]{--ac:var(--info);--ac-s:var(--info-s)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
math{font-size:1.08em}
.sg{text-decoration-line:overline;text-decoration-thickness:1px}

/* 헤더: 과목 색 밴드 */
.head{background:var(--ac-s);border-radius:22px;padding:18px 18px 14px;display:grid;gap:10px;position:relative;overflow:hidden;isolation:isolate}
.head::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--ac);opacity:.12;z-index:-1}
.head::before{content:"";position:absolute;right:40px;top:-30px;width:90px;height:90px;border-radius:50%;border:10px solid var(--ac);opacity:.1;z-index:-1}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ac)}
.head h1{font:400 clamp(26px,5.5vw,34px)/1.15 var(--f-disp);margin:0;text-wrap:balance}
.sems{display:flex;gap:3px;background:var(--sheet);border-radius:999px;padding:3px;width:max-content;max-width:100%;overflow-x:auto}
.sems button{border:0;background:none;border-radius:999px;padding:4px 13px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.sems button:hover{color:var(--ink)}
.sems button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.subj{display:flex;flex-wrap:wrap;gap:6px}
.subj button{--b:var(--ac);border:0;background:var(--sheet);border-radius:999px;padding:6px 14px 6px 11px;font:400 15px/1.2 var(--f-disp);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;color:var(--ink);box-shadow:0 1px 2px rgba(27,31,46,.06)}
.subj button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--b);flex:none}
.subj button:hover{box-shadow:inset 0 0 0 1.5px var(--b)}
.subj button[aria-pressed="true"]{background:var(--b);color:var(--on)}
.subj button[aria-pressed="true"]::before{background:var(--on)}
.subj [data-sub="kor"]{--b:var(--kor)} .subj [data-sub="eng"]{--b:var(--eng)} .subj [data-sub="math"]{--b:var(--math)} .subj [data-sub="sci"]{--b:var(--sci)}
.subj [data-sub="soc"]{--b:var(--soc)} .subj [data-sub="eth"]{--b:var(--eth)} .subj [data-sub="tech"]{--b:var(--tech)} .subj [data-sub="info"]{--b:var(--info)}
.data.code{white-space:pre;overflow-x:auto;font-size:13px;line-height:1.6}
.es{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin-bottom:12px}.satx{width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border:1px solid var(--rule);border-radius:10px;background:var(--sheet);color:inherit;font:inherit;resize:vertical}
.es .est{font-size:12.5px;color:var(--muted);margin-bottom:6px}.es .esq{font-weight:600;line-height:1.6}.es .escd{margin:8px 0;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;font-size:13.5px;line-height:1.6}.es textarea{width:100%;min-height:90px;border:1px solid var(--rule);border-radius:10px;padding:8px 10px;font:inherit;background:var(--sheet);color:inherit;box-sizing:border-box}.es .esr{margin-top:10px;font-size:13.5px;line-height:1.7}.es .esr .ok{color:#1a7f4b;font-weight:700}.es .esr .no{color:#c0392b;font-weight:700}.es .esm{margin-top:6px;padding:8px 12px;background:var(--chip);border-radius:10px}
.dday{font-weight:700;color:var(--ac,#c0392b)}.plan{margin-bottom:12px}.plan input[type=date]{font:inherit;padding:3px 6px}
.hmeta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-top:2px;font-size:13px;color:var(--muted)}
.namebox{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.namebox input{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);width:7.5em;font:inherit;padding:3px 8px;color:var(--ink)}

/* 탭 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sheet);border-radius:14px;padding:5px;gap:4px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px 2px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button:hover{color:var(--ac)}
.tabs button[aria-selected="true"]{background:var(--ac);color:var(--on)}
.tabs.six{grid-template-columns:repeat(6,1fr)}.tabs.six button{font-size:12.5px;letter-spacing:-.03em;white-space:nowrap;padding:9px 0}
/* 영단어 */
.wl-les{display:flex;flex-wrap:wrap;gap:6px}
.wsec{margin-top:14px}.wsec h3{font:400 17px var(--f-disp);margin:0 0 4px}
.cv.hid{color:transparent!important;background:var(--chip);border-radius:6px;cursor:pointer;user-select:none;min-width:4em;display:inline-block}
.star{color:var(--bad);font-size:12px;font-weight:700}
.wbk{display:inline-block;min-width:4.5em;border-bottom:1.5px solid var(--muted);height:1em;vertical-align:-2px}
.wrow2{display:grid;grid-template-columns:1.8em minmax(0,1fr) minmax(0,1fr);gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline}.wrow2:last-child{border-bottom:0}
.wrow2 .no{font:600 12.5px var(--f-num);color:var(--muted);text-align:right}.wrow2 .en{font-weight:700;font-size:16.5px}.wrow2 .en i{font-weight:400;font-size:12.5px;color:var(--muted);margin-left:6px}
.wrow2 .ko{font-size:14.5px}.wrow2 .de{grid-column:2/-1;font-size:14.5px;line-height:1.55}.wrow2 .eg,.wtab .eg{font-size:13px;color:var(--muted);margin-top:2px}
.wtab{display:grid;margin-top:4px}
.wtr{display:grid;grid-template-columns:2em minmax(7.5em,11em) 2.8em minmax(0,1fr);border-bottom:1px solid var(--rule);align-items:start}
.wtr>span{padding:8px 6px;min-width:0}.wtr>span+span{border-left:1px solid var(--rule)}
.wth{font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--ac)}
.wtr .no{font:600 13px var(--f-num);color:var(--muted);text-align:center}.wtr .ps{font-style:italic;font-size:12.5px;color:var(--muted);text-align:center}
.wtr .dd{font-size:14.5px;line-height:1.5}
.wtr input.win{width:100%;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;font:500 15px var(--f-body);background:var(--sheet);color:var(--ink)}
.vset{display:grid;gap:8px}.vset>.chip{justify-self:start}.vrow{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;white-space:nowrap}.vrow .muted{min-width:3.2em}
.spk{border:0;background:none;cursor:pointer;font-size:15px;line-height:1;padding:2px 5px;margin-left:4px;border-radius:6px;vertical-align:middle;opacity:.75}.spk:hover,.spk:focus-visible{opacity:1;background:var(--rule)}.spk.sm{font-size:13px}.spk.blk{display:block;margin:0 0 4px -3px}
.wtr .hint{display:block;font:500 12px var(--f-num);letter-spacing:.08em;color:var(--muted);margin-top:3px}
.wtr .wa{display:block;font-size:13px;margin-top:3px}
.wtr.ok input.win{border-color:var(--ok);background:var(--ok-soft)}.wtr.no input.win{border-color:var(--bad);background:var(--bad-soft)}
.wtr.ok .wa{color:var(--ok)}.wtr.no .wa{color:var(--bad)}.wtr .eg.ans{color:var(--ink)}
@media (max-width:480px){.wtr{grid-template-columns:1.6em minmax(6.5em,8em) 2.4em minmax(0,1fr)}.wtr>span{padding:7px 4px}.wtr .dd{font-size:13.5px}}

/* 출제 범위 */
.scope{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:12px 16px}
.scope summary{font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.scope summary small{color:var(--muted);font-weight:400}
.units{display:grid;gap:10px;margin-top:12px}
.unit{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.uh{border:0;background:none;padding:4px 0;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;text-align:left;width:12em;cursor:pointer;color:var(--ink)}
.uh .ck{flex:none;width:18px;height:18px;border:1.6px solid var(--ac);border-radius:5px;display:inline-grid;place-items:center;font-size:12px;line-height:1;color:var(--on)}
.uh[data-st="all"] .ck{background:var(--ac)}.uh[data-st="part"] .ck{background:var(--ac-s);color:var(--ac)}.uh:hover .ck{box-shadow:0 0 0 3px var(--ac-s)}
.rn{font:600 12px var(--f-num);color:var(--ac);flex:none}
.subs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px}
.chip:hover{border-color:var(--ac)}
.chip small{font-family:var(--f-num);color:var(--muted);margin-left:3px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chip.on small{color:inherit;opacity:.75}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}
.presets span{font-size:12px;color:var(--muted);align-self:center}
@media (max-width:560px){.unit{grid-template-columns:1fr;gap:2px}.uh{width:auto}}

/* 버튼 */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .sp{flex:1}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px 15px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn.pri:hover{color:var(--on);filter:brightness(1.07)}
.btn.sm{padding:5px 11px;font-size:13px}
.muted{color:var(--muted);font-size:13px}
.tally{font:500 13px var(--f-num);color:var(--muted)}

/* 문제지 */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:4px 18px;box-shadow:var(--shadow)}
.q{padding:18px 0 20px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
.q:last-child{border-bottom:0}
.qh{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.qn{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 9px;border-radius:999px;background:var(--ac-s);color:var(--ac);font:400 18px/1 var(--f-disp)}
.tag{font-size:12px;color:var(--muted)}
.lv{font:600 11px var(--f-num);border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--muted);background:var(--chip)}
.lv3{background:var(--ac);border-color:var(--ac);color:var(--on)}
.qt{line-height:1.8;min-width:0}
.cond{margin-top:6px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;overflow-wrap:anywhere}
.data{margin-top:6px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;font-family:var(--f-num);font-size:14px;overflow-wrap:anywhere;background:var(--chip)}
.psg{margin:8px 0;padding:12px 16px;background:var(--chip);border-left:4px solid var(--ac);border-radius:0 12px 12px 0;font-size:15px;line-height:1.8;max-width:65ch}
.data math{font-size:1.3em}
.fig{margin:0;display:flex;justify-content:center;overflow-x:auto}
.fig svg{width:100%;max-width:330px;height:auto}
.fig .ln{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round}
.fig .dash{stroke-dasharray:5 4}
.fig .arc{stroke:var(--ac);stroke-width:1.4;fill:none}
.fig .sh{fill:var(--ac-s);stroke:var(--ink);stroke-width:1.6}
.fig .dot{fill:var(--ink)}
.fig text{fill:var(--ink);font:500 13px var(--f-num)}
.fig text.v{font-family:var(--f-body);font-weight:600}
.tw{overflow-x:auto}
table.ft{border-collapse:collapse;margin:6px auto 0;font-size:14px;min-width:240px}
.ft th,.ft td{border:1px solid var(--rule);padding:5px 14px;text-align:center;font-variant-numeric:tabular-nums}
.ft th{font-weight:600;background:var(--ac-s);color:var(--ink)}
.ft .tot td{font-weight:700}
ol.opts{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.opts.short{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.opt{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:7px 9px;font-variant-numeric:tabular-nums}
.opt:hover{background:var(--ac-s)}
.bub{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--ac);color:var(--ac);display:grid;place-items:center;font:600 12px var(--f-num)}
.opt.on{background:var(--ac-s)}
.opt.on .bub{background:var(--ac);border-color:var(--ac);color:var(--on)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--on)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--on)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{background:none}
.opt.ok[disabled]:hover{background:var(--ok-soft)} .opt.no[disabled]:hover{background:var(--bad-soft)}
.mk{margin-left:auto;font-size:11px;font-weight:700;white-space:nowrap}
.ok .mk{color:var(--ok)} .no .mk{color:var(--bad)}
.exp{border-left:4px solid var(--ac);background:var(--ac-s);padding:11px 14px;border-radius:0 12px 12px 0;font-size:14px;line-height:1.8}
.exp b.h{display:block;font-size:12px;letter-spacing:.06em;color:var(--ac);margin-bottom:2px}
details.ex summary{font-size:13px;font-weight:600;color:var(--ac);cursor:pointer;width:max-content}

/* 모의고사 */
.cfg{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.cfg label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cfg input{width:6.5em;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;font:500 14px var(--f-num);background:var(--sheet);color:var(--ink)}
.ehead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:14px 0 12px;border-bottom:2px solid var(--ac);font-size:13px}
.ehead b{font:400 19px var(--f-disp);color:var(--ac)}
.score{background:var(--ac-s);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.score .big{font:400 40px/1 var(--f-disp);color:var(--ac)}
.score .big small{font:500 14px var(--f-body);color:var(--muted);margin-left:6px}
.omrrow{display:flex;flex-wrap:wrap;gap:6px}
.omrrow span{font:600 12px var(--f-num);padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet)}
.omrrow .o{border-color:var(--ok);color:var(--ok)} .omrrow .x{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.copybox{width:100%;min-height:160px;font:12px var(--f-num);border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--sheet);color:var(--ink)}

/* 오답노트·현황 */
.list{display:grid;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:0 16px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:6px}
.meter{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}

b.src{color:var(--ac);font-weight:600}
@media (max-width:420px){.jcard{grid-template-columns:1fr}}

.selfchk{display:flex;gap:6px;margin-left:auto}

<script>
/* ===== 기본 도구 ===== */
function mkR(seed){let a=seed>>>0;const f=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  return{f,i:(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)),pick:arr=>arr[Math.floor(f()*arr.length)],
    shuffle:arr=>{const b=arr.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}}}
const r3=v=>Math.round(v*1000)/1000;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const NUM=['','','','삼','사','오','육','칠','팔','구','십','십일','십이','십삼','십사','십오','십육','십칠','십팔','십구','이십','이십일','이십이','이십삼','이십사','이십오','이십육','이십칠','이십팔','이십구','삼십','삼십일','삼십이','삼십삼','삼십사','삼십오','삼십육'];
const CIRC=['①','②','③','④','⑤'];
const piF=u=>v=>`${v===1?'':v}π ${u}`;
const ex=(p,a)=>`${p===1?'':p}x${a>0?' + '+a:a<0?' − '+(-a):''}`;
const sg=s=>`<span class="sg">${s}</span>`;
const psg=t=>`<div class="psg">${t}</div>`;
function mtok(s){return String(s).replace(/(\d+(?:\.\d+)?)|([a-zA-Zπ])|(\S)/g,(m,n,l,o)=>n?`<mn>${n}</mn>`:l?`<mi>${l}</mi>`:`<mo>${o==='*'?'×':o}</mo>`)}
const fr=(a,b)=>`<math><mfrac><mrow>${mtok(a)}</mrow><mrow>${mtok(b)}</mrow></mfrac></math>`;
function mc(R,ans,wrongs,fmt){fmt=fmt||String;const isN=typeof ans==='number';const A=fmt(ans);const seen=new Set([A]);const out=[];
  const push=v=>{if(v==null)return;if(typeof v==='number'){if(!isFinite(v)||(v<=0&&!(isN&&ans<=0)))return;v=r3(v);if(isN&&Number.isInteger(ans)&&!Number.isInteger(v))return}
    const k=fmt(v);if(seen.has(k))return;seen.add(k);out.push({v,k})};
  for(const w of R.shuffle(wrongs)){if(out.length>=4)break;push(w)}
  if(isN){const st=Number.isInteger(ans)?Math.max(1,Math.round(ans/12)):(ans<1?0.02:0.5);
    for(let d=1;out.length<4&&d<80;d++){push(ans+d*st);if(out.length<4)push(ans-d*st)}
    const all=[{v:ans,k:A},...out].sort((x,y)=>x.v-y.v);return{opts:all.map(o=>o.k),ans:A}}
  return{opts:R.shuffle([A,...out.map(o=>o.k)]),ans:A}}
const fixed=(opts,ans)=>({opts,ans});
/* 문항 은행: [문제, 정답, [오답…], 풀이] 중 하나를 골라 보기 순서를 섞는다 */
function bank(id,u,name,lv,items){return{id,u,name,lv,bank:true,n:items.length,g:R=>{const it=R.pick(items);return{q:it[0],...mc(R,it[1],it[2]),exp:it[3]}}}}

/* ===== 그림(SVG) ===== */
const f1=v=>Math.round(v*10)/10;
function angOf(P,Q){let a=Math.atan2(-(Q[1]-P[1]),Q[0]-P[0])*180/Math.PI;return (a+360)%360}
function arcAt(P,Q1,Q2,r){let a1=angOf(P,Q1),a2=angOf(P,Q2);if(a2<a1)a2+=360;const t=x=>x*Math.PI/180;
  const s=[P[0]+r*Math.cos(t(a1)),P[1]-r*Math.sin(t(a1))],e=[P[0]+r*Math.cos(t(a2)),P[1]-r*Math.sin(t(a2))];
  return `<path class="arc" d="M${f1(s[0])} ${f1(s[1])}A${r} ${r} 0 ${a2-a1>180?1:0} 0 ${f1(e[0])} ${f1(e[1])}"/>`}
const txt=(s,x,y,anc,cls)=>`<text x="${x}" y="${y}"${anc?` text-anchor="${anc}"`:''}${cls?` class="${cls}"`:''}>${s}</text>`;
const svg=(w,h,body)=>`<svg viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`;
function figSeg(aLab){const A=[30,60],N=[95,60],M=[160,60],B=[290,60];
  return svg(320,105,`<path class="ln" d="M30 60H290"/>${[A,N,M,B].map(p=>`<circle class="dot" cx="${p[0]}" cy="60" r="3.2"/>`).join('')}
  <path class="arc" d="M62.5 55V65 M127.5 55V65"/><path class="arc" d="M222 55V65 M228 55V65"/>
  ${txt('A',30,44,'middle','v')}${txt('N',95,44,'middle','v')}${txt('M',160,44,'middle','v')}${txt('B',290,44,'middle','v')}
  <path class="ln dash" d="M30 78V92H290V78"/>${txt(aLab,160,100,'middle')}`)}
function figVert(e1,e2){const C=[160,95],L1a=[40,40],L1b=[280,150],L2a=[60,170],L2b=[260,20];
  return svg(320,190,`<path class="ln" d="M40 40L280 150M60 170L260 20"/>${arcAt(C,L1a,L2a,22)}${arcAt(C,L1b,L2b,22)}${txt(e1,132,104,'end')}${txt(e2,196,97)}`)}
function figPar(L){const P=[[145,60],[215,150]],T1=[110,15],T2=[250,195];
  const off={ur:[22,-10,'start'],ul:[-22,-10,'end'],dr:[26,22,'start'],dl:[-22,22,'end']};
  const dirs=P.map(p=>({R:[p[0]+50,p[1]],Lf:[p[0]-50,p[1]],U:T1,D:T2}));
  const wedge={ur:['R','U'],ul:['U','Lf'],dl:['Lf','D'],dr:['D','R']};
  let s=`<path class="ln" d="M20 60H300M20 150H300M110 15L250 195"/>${txt('l',24,52,'','v')}${txt('m',24,142,'','v')}`;
  for(const l of L){const p=P[l.pt-1],o=off[l.pos],w=wedge[l.pos],d=dirs[l.pt-1];
    s+=arcAt(p,d[w[0]],d[w[1]],15)+txt(l.t,p[0]+o[0],p[1]+o[1],o[2])}
  return svg(330,205,s)}
function figCuboid(){return svg(300,190,`<path class="ln" d="M60 60H190V160H60Z M60 60L110 25H240L190 60 M240 25V125L190 160"/><path class="ln dash" d="M110 25V125H240 M110 125L60 160"/>
  ${[['A',48,62],['B',196,74],['C',248,24],['D',100,20],['E',48,174],['F',196,176],['G',248,132],['H',98,124]].map(a=>txt(a[0],a[1],a[2],'','v')).join('')}`)}
function figPrism(){return svg(280,190,`<path class="ln" d="M70 45L190 55L140 20Z M70 45V155 M190 55V165 M70 155L190 165"/><path class="ln dash" d="M140 20V130 M70 155L140 130L190 165"/>
  ${[['A',56,46],['B',196,58],['C',134,14],['D',56,162],['E',196,174],['F',146,128]].map(a=>txt(a[0],a[1],a[2],'','v')).join('')}`)}
function figTri(la,lb,le){const A=[150,20],B=[30,170],C=[230,170],E=[320,170];
  return svg(330,192,`<path class="ln" d="M150 20L30 170H320M150 20L230 170"/>${arcAt(A,B,C,18)}${arcAt(B,C,A,22)}${arcAt(C,E,A,20)}
  ${txt('A',150,14,'middle','v')}${txt('B',22,186,'middle','v')}${txt('C',230,188,'middle','v')}
  ${txt(la,146,78,'middle')}${txt(lb,60,158)}${txt(le,256,158)}`)}
function figSector(th,rl,tl){const c=[150,120],r=85,t=x=>x*Math.PI/180;const a1=90-th/2,a2=90+th/2;
  const p=a=>[f1(c[0]+r*Math.cos(t(a))),f1(c[1]-r*Math.sin(t(a)))];const P1=p(a1),P2=p(a2);
  const mid=[(c[0]+P2[0])/2,(c[1]+P2[1])/2];const dl=th<90?52:th<=180?30:24;
  return svg(300,215,`<path class="sh" d="M${c[0]} ${c[1]}L${P1[0]} ${P1[1]}A${r} ${r} 0 ${th>180?1:0} 0 ${P2[0]} ${P2[1]}Z"/>${arcAt(c,P1,P2,14)}
  <circle class="dot" cx="150" cy="120" r="2.6"/>${txt('O',150,138+(th>180?-30:0),'middle','v')}
  ${tl?txt(tl,150,120-dl,'middle'):''}${rl?txt(rl,f1(mid[0]-8),f1(mid[1]+(th>180?16:-4)),'end'):''}`)}
function figCyl(rl,hl){return svg(300,195,`<ellipse class="ln" cx="150" cy="40" rx="70" ry="16"/><path class="ln" d="M80 40V160M220 40V160M80 160A70 16 0 0 0 220 160M150 40H220"/><path class="ln dash" d="M80 160A70 16 0 0 1 220 160"/><circle class="dot" cx="150" cy="40" r="2.4"/>
  ${txt(rl,185,32,'middle')}${txt(hl,228,104)}`)}
function figCone(rl,side,isSlant){return svg(300,190,`<path class="ln" d="M150 25L80 160M150 25L220 160M80 160A70 16 0 0 0 220 160M150 160H220"/><path class="ln dash" d="M80 160A70 16 0 0 1 220 160${isSlant?'':'M150 25V160'}"/><circle class="dot" cx="150" cy="160" r="2.4"/>
  ${txt(rl,185,153,'middle')}${isSlant?txt(side,192,92):txt(side,156,100)}`)}
function figSph(rl){return svg(300,190,`<circle class="ln" cx="150" cy="95" r="75"/><path class="ln" d="M75 95A75 18 0 0 0 225 95M150 95H225"/><path class="ln dash" d="M75 95A75 18 0 0 1 225 95"/><circle class="dot" cx="150" cy="95" r="2.4"/>${txt(rl,188,88,'middle')}`)}

/* ===== 초등 5·6학년 공통 도구 ===== */
const SEMS={'5-1':{},'5-2':{},'6-1':{},'6-2':{}};
const SEMNAME={'5-1':['초5','1학기','5학년 1학기 · 단원평가 대비'],'5-2':['초5','2학기','5학년 2학기 · 단원평가·학기말 대비'],
 '6-1':['초6','1학기','6학년 1학기 · 단원평가 대비'],'6-2':['초6','2학기','6학년 2학기 · 단원평가·학기말 대비']};
let _T=[];const add=o=>_T.push(o);
const JOKBO=[];const EE_D={};const WB={};const EE_BOOK={};
const cm=n=>Number(n).toLocaleString('ko-KR');
const sq=u=>u+'²',cb=u=>u+'³';
/* 분수: 기약분수, 가분수는 대분수로 */
function fq(n,d){if(d<0){n=-n;d=-d}const g=gcd(Math.abs(n),d)||1;return[n/g,d/g]}
function F(n,d,imp){[n,d]=fq(n,d);if(d===1)return String(n);if(!imp&&n>d){const w=Math.floor(n/d);return`${w}${fr(n-w*d,d)}`}return fr(n,d)}
const FT=(n,d)=>{[n,d]=fq(n,d);if(d===1)return String(n);if(n>d){const w=Math.floor(n/d);return`${w}과 ${n-w*d}/${d}`}return`${n}/${d}`};
/* 분수 정답 보기: 오답 후보 [분자,분모] + 자동 후보 */
function mcF(R,a,wr){const [n,d]=fq(a[0],a[1]);const ext=[[n+1,d],[n-1,d],[n,d+1],[n+d,d],[n+2,d],[n*2,d],[n,d*2],[n+3,d],[Math.max(1,n-2),d]];
 const c=(wr||[]).concat(ext).filter(p=>p[0]>0&&p[1]>0&&!(fq(...p)[0]===n&&fq(...p)[1]===d));
 const seen=new Set([F(n,d)]),out=[];for(const p of c){const s=F(...p);if(!seen.has(s)){seen.add(s);out.push(s)}if(out.length>=8)break}

  ${!o.pages||!AI_IMG?'<p class="ainote">이 시험지는 사진을 보낼 수 없어요. 질문에 문제 내용을 함께 적어 주세요.</p>':''}`:''}
  <div class="ailog">${st.qa.map(m=>`<div class="aimsg me">${aiEsc(m.q)}</div>${m.a!=null?`<div class="aimsg t">${aiFmt(m.a)}</div>`:''}${m.err?`<p class="ainote">${aiEsc(m.err)}</p>`:''}`).join('')}${st.busy&&!(st.qa.at(-1)||{}).a?'<div class="aimsg t think">생각하는 중…</div>':''}</div>
  <div class="aiq">${aiQuick(st).map(q=>`<button class="chip" data-aiq="${aiEsc(q)}" ${st.busy?'disabled':''}>${q}</button>`).join('')}</div>
  <div class="aiin"><input id="ait-${hsh(st.key)}" data-aitxt="1" placeholder="궁금한 점을 적어 보세요" autocomplete="off" ${st.busy?'disabled':''}>${st.busy?'<button class="btn sm" data-aix="1">멈추기</button>':'<button class="btn pri sm" data-ais="1">보내기</button>'}</div></div>`}
const aiVis=l=>{const a=[...l];return a.find(x=>x.offsetParent!==null)||a[0]};
function aiAnchor(key){return aiVis(document.querySelectorAll(`[data-aik="${CSS.escape(key)}"]`))}
const aiBoxes=key=>document.querySelectorAll(`[data-aib="${CSS.escape(key)}"]`);
function aiRender(key){const st=AIS.get(key),an=aiAnchor(key);if(!an)return;aiBoxes(key).forEach(x=>{if(!st||!st.open||x.offsetParent===null)x.remove()});let box=aiVis(aiBoxes(key));
  if(!st||!st.open)return;
  const html=aiBoxHTML(st);if(box){const typed=box.querySelector('[data-aitxt]')?.value||'';box.outerHTML=html;box=aiVis(aiBoxes(key));if(!st.busy&&typed)box.querySelector('[data-aitxt]').value=typed}
  else{an.tagName==='ARTICLE'?an.insertAdjacentHTML('beforeend',html):an.insertAdjacentHTML('afterend',html)}
  const lg=aiVis(aiBoxes(key))?.querySelector('.ailog');if(lg)lg.scrollTop=lg.scrollHeight}
const AI_ERR={rate_limited:'질문이 너무 많아요. 잠시 뒤에 다시 물어보세요.',session_expired:'claude.ai에 다시 로그인한 뒤 물어보세요.',refused:'이 질문에는 답할 수 없어요. 질문을 바꿔 보세요.',empty_completion:'답이 비어 있어요. 질문을 조금 바꿔 보세요.',image_rejected:'사진을 보낼 수 없어요. 문제 내용을 글로 적어 주세요.',prompt_too_large:'대화가 너무 길어요. 닫았다가 다시 열어 새로 물어보세요.'};
async function aiAsk(key,q){const st=AIS.get(key);if(!st||st.busy||!SAMPLE||!q.trim())return;
  st.qa.push({q:q.trim(),a:null});st.busy=true;st.ctl=new AbortController();aiRender(key);
  const cur=st.qa.at(-1);
  try{const ctx=await aiCtx(key);const hist=st.qa.slice(-6),turns=[];
    hist.forEach((m,i)=>{turns.push({role:'user',content:i===0?`${AI_RULES}\n\n${ctx.txt}\n\n[학생 질문]\n${m.q}`:m.q});if(m!==cur&&m.a)turns.push({role:'assistant',content:m.a})});
    if(hist.length>1)turns[turns.length-1]={role:'user',content:`(지금 문제 상태)\n${ctx.txt}\n\n[학생 질문]\n${cur.q}`};
    const opt={signal:st.ctl.signal,cache:false,onText:({text})=>{cur.a=text;const el=document.querySelector(`[data-aib="${CSS.escape(key)}"] .ailog .aimsg.t:last-child, [data-aib="${CSS.escape(key)}"] .ailog .think`);if(el&&el.classList.contains('think')){aiRender(key)}else if(el){el.innerHTML=aiFmt(text);const lg=el.parentElement;lg.scrollTop=lg.scrollHeight}}};
    if(ctx.imgs.length)opt.images=ctx.imgs;
    const r=await SAMPLE(turns,opt);cur.a=r.text;if(r.truncated)cur.err='답이 길어서 중간에 끊겼어요. 더 짧게 물어보세요.'}
  catch(e){const c=e&&e.code;if(c==='refused')cur.a=null;else cur.a=e&&e.text?e.text:null;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){cur.err='이 화면에서는 AI 선생님을 쓸 수 없어요. (Claude 사용을 허용하지 않았거나 계정에서 꺼져 있어요)'}
    else if(c==='images_unavailable'){AI_IMG=false;cur.err='사진은 보낼 수 없어요. 다시 보내 주세요.'}
    else if(c!=='cancelled')cur.err=AI_ERR[c]||'연결이 끊겼어요. 다시 보내 보세요.';
    if(c==='cancelled'&&!cur.a)cur.err='멈췄어요.'}
  finally{st.busy=false;st.ctl=null;aiRender(key)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ai],[data-aic],[data-aiq],[data-ais],[data-aix]');if(!b)return;e.stopPropagation();e.preventDefault();
  if(b.dataset.ai){const an=b.closest('[data-aik]');if(!an)return;const key=an.dataset.aik;let st=AIS.get(key);
    if(!st){st={key,kind:b.dataset.ai,qa:[],open:false,busy:false,page:1,num:''};AIS.set(key,st)}const shown=[...aiBoxes(key)].some(x=>x.offsetParent!==null);st.open=shown?false:true;aiRender(key);
    if(st.open)aiVis(aiBoxes(key))?.querySelector('[data-aitxt]')?.focus({preventScroll:true});return}
  const box=b.closest('[data-aib]');if(!box)return;const key=box.dataset.aib,st=AIS.get(key);if(!st)return;
  if(b.dataset.aic){st.ctl?.abort();st.open=false;aiRender(key);return}
  if(b.dataset.aix){st.ctl?.abort();return}
  if(b.dataset.aiq){aiAsk(key,b.dataset.aiq);return}
  if(b.dataset.ais){const inp=box.querySelector('[data-aitxt]');const v=inp.value;inp.value='';aiAsk(key,v)}},true);
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||!t.dataset.aitxt||e.key!=='Enter'||e.isComposing)return;e.preventDefault();const box=t.closest('[data-aib]');const v=t.value;t.value='';aiAsk(box.dataset.aib,v)},true);
document.addEventListener('input',e=>{const t=e.target;const box=t.closest&&t.closest('[data-aib]');if(!box)return;const st=AIS.get(box.dataset.aib);if(!st)return;
  if(t.dataset.ainum)st.num=t.value;if(t.dataset.aipg)st.page=+t.value},true);
document.addEventListener('change',e=>{const t=e.target;const box=t.closest&&t.closest('[data-aib]');if(!box)return;const st=AIS.get(box.dataset.aib);if(st&&t.dataset.aipg)st.page=+t.value},true);
/* 화면이 다시 그려져도 열어 둔 대화를 다시 붙임 */
new MutationObserver(()=>{for(const [k,st] of AIS){const an=st.open&&aiAnchor(k);if(an&&an.offsetParent!==null&&![...aiBoxes(k)].some(x=>x.offsetParent!==null))aiRender(k)}}).observe(document.querySelector('.wrap'),{childList:true,subtree:true});

</script>

 const addS=(x)=>{if(!x)return;for(const id in x.t||{}){const a=t[id]||(t[id]=[0,0]);a[0]+=x.t[id][0];a[1]+=x.t[id][1]}(x.w||[]).forEach(e=>w.push(e))};
