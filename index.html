<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>중1 2학기 문제은행</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a3fd0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="문제은행">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 과목마다 고유 색을 가진 컬러 밴드 헤더 → 그 색이 탭·OMR 버블·번호 배지·해설까지 이어지는 한 줄 시험지 */
:root{
  --bg:#f3f4f9; --sheet:#ffffff; --ink:#1b1f2e; --muted:#62697e; --rule:#e1e4ee; --chip:#f1f3f8;
  --ok:#16875a; --ok-soft:#e2f5eb; --bad:#d23b3b; --bad-soft:#fdeaea;
  --kor:#d6363c; --kor-s:#fdebea; --eng:#1f6fd1; --eng-s:#e6effd; --math:#6a3fd0; --math-s:#efe9fc;
  --sci:#12825a; --sci-s:#e0f3e9; --soc:#b45f0a; --soc-s:#fcefdf; --eth:#0a7d85; --eth-s:#ddf2f3;
  --tech:#c02f6d; --tech-s:#fbe5ef; --info:#4450c9; --info-s:#e8eafb;
  --ac:var(--math); --ac-s:var(--math-s);
  --omr:var(--ac); --omr-soft:var(--ac-s); --fill:var(--ac); --on:#ffffff;
  --shadow:0 1px 2px rgba(27,31,46,.05),0 6px 20px rgba(27,31,46,.06);
  --f-disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --sheet:#181c26; --ink:#e8eaf2; --muted:#9ca3b6; --rule:#2a3040; --chip:#212634;
  --ok:#5fd19e; --ok-soft:#143022; --bad:#ff8a84; --bad-soft:#3a1c1c;
  --kor:#ff8b8f; --kor-s:#3a1e22; --eng:#80b4ff; --eng-s:#172a45; --math:#b59dff; --math-s:#29213f;
  --sci:#5fd3a2; --sci-s:#12301f; --soc:#f4b25e; --soc-s:#36270f; --eth:#5ad0d0; --eth-s:#0f2f31;
  --tech:#ff8fbe; --tech-s:#3a1a2a; --info:#9ea6ff; --info-s:#1f2347;
  --on:#10131a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1218; --sheet:#181c26; --ink:#e8eaf2; --muted:#9ca3b6; --rule:#2a3040; --chip:#212634;
  --ok:#5fd19e; --ok-soft:#143022; --bad:#ff8a84; --bad-soft:#3a1c1c;
  --kor:#ff8b8f; --kor-s:#3a1e22; --eng:#80b4ff; --eng-s:#172a45; --math:#b59dff; --math-s:#29213f;
  --sci:#5fd3a2; --sci-s:#12301f; --soc:#f4b25e; --soc-s:#36270f; --eth:#5ad0d0; --eth-s:#0f2f31;
  --tech:#ff8fbe; --tech-s:#3a1a2a; --info:#9ea6ff; --info-s:#1f2347;
  --on:#10131a; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
:root[data-s="kor"]{--ac:var(--kor);--ac-s:var(--kor-s)}
:root[data-s="eng"]{--ac:var(--eng);--ac-s:var(--eng-s)}
:root[data-s="math"]{--ac:var(--math);--ac-s:var(--math-s)}
:root[data-s="sci"]{--ac:var(--sci);--ac-s:var(--sci-s)}
:root[data-s="soc"]{--ac:var(--soc);--ac-s:var(--soc-s)}
:root[data-s="eth"]{--ac:var(--eth);--ac-s:var(--eth-s)}
:root[data-s="tech"]{--ac:var(--tech);--ac-s:var(--tech-s)}
:root[data-s="info"]{--ac:var(--info);--ac-s:var(--info-s)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
math{font-size:1.08em}
.sg{text-decoration-line:overline;text-decoration-thickness:1px}

/* 헤더: 과목 색 밴드 */
.head{background:var(--ac-s);border-radius:22px;padding:18px 18px 14px;display:grid;gap:10px;position:relative;overflow:hidden;isolation:isolate}
.head::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--ac);opacity:.12;z-index:-1}
.head::before{content:"";position:absolute;right:40px;top:-30px;width:90px;height:90px;border-radius:50%;border:10px solid var(--ac);opacity:.1;z-index:-1}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ac)}
.head h1{font:400 clamp(26px,5.5vw,34px)/1.15 var(--f-disp);margin:0;text-wrap:balance}
.sems{display:flex;gap:3px;background:var(--sheet);border-radius:999px;padding:3px;width:max-content;max-width:100%;overflow-x:auto}
.sems button{border:0;background:none;border-radius:999px;padding:4px 13px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.sems button:hover{color:var(--ink)}
.sems button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.subj{display:flex;flex-wrap:wrap;gap:6px}
.subj button{--b:var(--ac);border:0;background:var(--sheet);border-radius:999px;padding:6px 14px 6px 11px;font:400 15px/1.2 var(--f-disp);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;color:var(--ink);box-shadow:0 1px 2px rgba(27,31,46,.06)}
.subj button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--b);flex:none}
.subj button:hover{box-shadow:inset 0 0 0 1.5px var(--b)}
.subj button[aria-pressed="true"]{background:var(--b);color:var(--on)}
.subj button[aria-pressed="true"]::before{background:var(--on)}
.subj [data-sub="kor"]{--b:var(--kor)} .subj [data-sub="eng"]{--b:var(--eng)} .subj [data-sub="math"]{--b:var(--math)} .subj [data-sub="sci"]{--b:var(--sci)}
.subj [data-sub="soc"]{--b:var(--soc)} .subj [data-sub="eth"]{--b:var(--eth)} .subj [data-sub="tech"]{--b:var(--tech)} .subj [data-sub="info"]{--b:var(--info)}
.data.code{white-space:pre;overflow-x:auto;font-size:13px;line-height:1.6}
.hmeta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-top:2px;font-size:13px;color:var(--muted)}
.namebox{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500}
.namebox input{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);width:7.5em;font:inherit;padding:3px 8px;color:var(--ink)}

/* 탭 */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sheet);border-radius:14px;padding:5px;gap:4px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px 2px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tabs button:hover{color:var(--ac)}
.tabs button[aria-selected="true"]{background:var(--ac);color:var(--on)}

/* 출제 범위 */
.scope{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:12px 16px}
.scope summary{font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.scope summary small{color:var(--muted);font-weight:400}
.units{display:grid;gap:10px;margin-top:12px}
.unit{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.uh{border:0;background:none;padding:4px 0;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;text-align:left;width:12em;cursor:pointer;color:var(--ink)}
.uh .ck{flex:none;width:18px;height:18px;border:1.6px solid var(--ac);border-radius:5px;display:inline-grid;place-items:center;font-size:12px;line-height:1;color:var(--on)}
.uh[data-st="all"] .ck{background:var(--ac)}.uh[data-st="part"] .ck{background:var(--ac-s);color:var(--ac)}.uh:hover .ck{box-shadow:0 0 0 3px var(--ac-s)}
.rn{font:600 12px var(--f-num);color:var(--ac);flex:none}
.subs{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:4px 12px;font-size:13px}
.chip:hover{border-color:var(--ac)}
.chip small{font-family:var(--f-num);color:var(--muted);margin-left:3px}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chip.on small{color:inherit;opacity:.75}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--rule)}
.presets span{font-size:12px;color:var(--muted);align-self:center}
@media (max-width:560px){.unit{grid-template-columns:1fr;gap:2px}.uh{width:auto}}

/* 버튼 */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .sp{flex:1}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:8px 15px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn.pri:hover{color:var(--on);filter:brightness(1.07)}
.btn.sm{padding:5px 11px;font-size:13px}
.muted{color:var(--muted);font-size:13px}
.tally{font:500 13px var(--f-num);color:var(--muted)}

/* 문제지 */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:18px;padding:4px 18px;box-shadow:var(--shadow)}
.q{padding:18px 0 20px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
.q:last-child{border-bottom:0}
.qh{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.qn{display:inline-grid;place-items:center;min-width:32px;height:32px;padding:0 9px;border-radius:999px;background:var(--ac-s);color:var(--ac);font:400 18px/1 var(--f-disp)}
.tag{font-size:12px;color:var(--muted)}
.lv{font:600 11px var(--f-num);border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--muted);background:var(--chip)}
.lv3{background:var(--ac);border-color:var(--ac);color:var(--on)}
.qt{line-height:1.8;min-width:0}
.cond{margin-top:6px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;overflow-wrap:anywhere}
.data{margin-top:6px;padding:8px 12px;border:1px solid var(--rule);border-radius:10px;font-family:var(--f-num);font-size:14px;overflow-wrap:anywhere;background:var(--chip)}
.psg{margin:8px 0;padding:12px 16px;background:var(--chip);border-left:4px solid var(--ac);border-radius:0 12px 12px 0;font-size:15px;line-height:1.8;max-width:65ch}
.data math{font-size:1.3em}
.fig{margin:0;display:flex;justify-content:center;overflow-x:auto}
.fig svg{width:100%;max-width:330px;height:auto}
.fig .ln{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linecap:round}
.fig .dash{stroke-dasharray:5 4}
.fig .arc{stroke:var(--ac);stroke-width:1.4;fill:none}
.fig .sh{fill:var(--ac-s);stroke:var(--ink);stroke-width:1.6}
.fig .dot{fill:var(--ink)}
.fig text{fill:var(--ink);font:500 13px var(--f-num)}
.fig text.v{font-family:var(--f-body);font-weight:600}
.tw{overflow-x:auto}
table.ft{border-collapse:collapse;margin:6px auto 0;font-size:14px;min-width:240px}
.ft th,.ft td{border:1px solid var(--rule);padding:5px 14px;text-align:center;font-variant-numeric:tabular-nums}
.ft th{font-weight:600;background:var(--ac-s);color:var(--ink)}
.ft .tot td{font-weight:700}
ol.opts{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.opts.short{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.opt{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:none;border-radius:12px;padding:7px 9px;font-variant-numeric:tabular-nums}
.opt:hover{background:var(--ac-s)}
.bub{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--ac);color:var(--ac);display:grid;place-items:center;font:600 12px var(--f-num)}
.opt.on{background:var(--ac-s)}
.opt.on .bub{background:var(--ac);border-color:var(--ac);color:var(--on)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--on)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--on)}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{background:none}
.opt.ok[disabled]:hover{background:var(--ok-soft)} .opt.no[disabled]:hover{background:var(--bad-soft)}
.mk{margin-left:auto;font-size:11px;font-weight:700;white-space:nowrap}
.ok .mk{color:var(--ok)} .no .mk{color:var(--bad)}
.exp{border-left:4px solid var(--ac);background:var(--ac-s);padding:11px 14px;border-radius:0 12px 12px 0;font-size:14px;line-height:1.8}
.exp b.h{display:block;font-size:12px;letter-spacing:.06em;color:var(--ac);margin-bottom:2px}
details.ex summary{font-size:13px;font-weight:600;color:var(--ac);cursor:pointer;width:max-content}

/* 모의고사 */
.cfg{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
.cfg label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cfg input{width:6.5em;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;font:500 14px var(--f-num);background:var(--sheet);color:var(--ink)}
.ehead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:14px 0 12px;border-bottom:2px solid var(--ac);font-size:13px}
.ehead b{font:400 19px var(--f-disp);color:var(--ac)}
.score{background:var(--ac-s);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.score .big{font:400 40px/1 var(--f-disp);color:var(--ac)}
.score .big small{font:500 14px var(--f-body);color:var(--muted);margin-left:6px}
.omrrow{display:flex;flex-wrap:wrap;gap:6px}
.omrrow span{font:600 12px var(--f-num);padding:2px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet)}
.omrrow .o{border-color:var(--ok);color:var(--ok)} .omrrow .x{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.copybox{width:100%;min-height:160px;font:12px var(--f-num);border:1px solid var(--rule);border-radius:10px;padding:8px;background:var(--sheet);color:var(--ink)}

/* 오답노트·현황 */
.list{display:grid;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:0 16px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:center}
.row:last-child{border-bottom:0}
.row .t{min-width:0}
.row .t p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:6px}
.meter{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--ok);border-radius:999px}
.meter i.lo{background:var(--bad)}
.num{font:600 14px var(--f-num);text-align:right;white-space:nowrap}
.empty{background:var(--sheet);border:1.5px dashed var(--rule);border-radius:16px;padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
h2.sec{font:400 19px var(--f-disp);margin:10px 0 0;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--ac)}
.foot{font-size:12px;color:var(--muted);text-align:center;text-wrap:balance}

/* 족보 */
.jsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.jsum div{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:11px 14px}
.jsum b{display:block;font:400 24px/1.2 var(--f-disp);color:var(--ac)}
.jsum span{font-size:12px;color:var(--muted)}
.jcard{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:center}
.jcard:last-child{border-bottom:0}
.jcard .t{min-width:0}
.jcard .t b{font:400 16.5px var(--f-disp)}
.jcard .t p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.jcard .t a{color:var(--ac);font-size:12px}
.pill{display:inline-block;font:600 11px var(--f-body);border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:0 8px;margin-left:4px;color:var(--muted);vertical-align:2px}
.pill.hot{border-color:var(--ac);background:var(--ac-s);color:var(--ac)}
.note{font-size:13px;color:var(--muted);background:var(--sheet);border:1.5px dashed var(--rule);border-radius:14px;padding:10px 14px;line-height:1.7}
b.src{color:var(--ac);font-weight:600}
@media (max-width:420px){.jcard{grid-template-columns:1fr}}
.pgs{display:grid;gap:10px;margin-top:10px}
.pgs img{width:100%;height:auto;border:1px solid var(--rule);border-radius:10px;background:#fff;display:block}
.omr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:4px 14px;margin-top:10px}
.orow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--rule);min-width:0}
.orow .on{font:600 13px var(--f-num);width:2.6em;flex:none;color:var(--ac)}
.orow .b{width:27px;height:27px;border-radius:50%;border:1.5px solid var(--ac);background:none;color:var(--ac);font:600 12px var(--f-num);padding:0;flex:none}
.orow .b.sel{background:var(--ac);border-color:var(--ac);color:var(--on)}
.orow .b.ans{background:var(--ok);border-color:var(--ok);color:var(--on)}
.orow .b.bad{background:var(--bad);border-color:var(--bad);color:var(--on)}
.orow .res{margin-left:auto;font:700 13px var(--f-num)}
.orow .res.o{color:var(--ok)} .orow .res.x{color:var(--bad)}
.orow .sa{font-size:12px;color:var(--muted);min-width:0}
.orow.wide{grid-column:1/-1;flex-wrap:wrap}
.model{font-size:13px;background:var(--ac-s);border-left:4px solid var(--ac);padding:7px 11px;border-radius:0 10px 10px 0;width:100%}
.selfchk{display:flex;gap:6px;margin-left:auto}
.stick{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow)}
/* AI 선생님 */
.aibar{display:none;gap:6px;flex-wrap:wrap}
:root.ai-on .aibar{display:flex}
.aibtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ac);background:var(--sheet);color:var(--ac);border-radius:999px;padding:5px 13px 5px 10px;font-weight:600;font-size:13px}
.aibtn::before{content:"";width:14px;height:14px;flex:none;background:var(--ac);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.aibtn:hover{background:var(--ac-s)}
.aibox{border:1.5px solid var(--ac);border-radius:16px;padding:12px 14px;display:grid;gap:10px;background:var(--sheet);min-width:0}
.aihd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.aihd b{font:400 16px var(--f-disp);color:var(--ac)}

<script>
/* ===== 기본 도구 ===== */
function mkR(seed){let a=seed>>>0;const f=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  return{f,i:(lo,hi)=>lo+Math.floor(f()*(hi-lo+1)),pick:arr=>arr[Math.floor(f()*arr.length)],
    shuffle:arr=>{const b=arr.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}}}
const r3=v=>Math.round(v*1000)/1000;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const NUM=['','','','삼','사','오','육','칠','팔','구','십','십일','십이','십삼','십사','십오','십육','십칠','십팔','십구','이십','이십일','이십이','이십삼','이십사','이십오','이십육','이십칠','이십팔','이십구','삼십','삼십일','삼십이','삼십삼','삼십사','삼십오','삼십육'];
const CIRC=['①','②','③','④','⑤'];
const piF=u=>v=>`${v===1?'':v}π ${u}`;
const ex=(p,a)=>`${p===1?'':p}x${a>0?' + '+a:a<0?' − '+(-a):''}`;
const sg=s=>`<span class="sg">${s}</span>`;
const psg=t=>`<div class="psg">${t}</div>`;
function mtok(s){return String(s).replace(/(\d+(?:\.\d+)?)|([a-zA-Zπ])|(\S)/g,(m,n,l,o)=>n?`<mn>${n}</mn>`:l?`<mi>${l}</mi>`:`<mo>${o==='*'?'×':o}</mo>`)}
const fr=(a,b)=>`<math><mfrac><mrow>${mtok(a)}</mrow><mrow>${mtok(b)}</mrow></mfrac></math>`;
function mc(R,ans,wrongs,fmt){fmt=fmt||String;const isN=typeof ans==='number';const A=fmt(ans);const seen=new Set([A]);const out=[];
  const push=v=>{if(v==null)return;if(typeof v==='number'){if(!isFinite(v)||(v<=0&&!(isN&&ans<=0)))return;v=r3(v);if(isN&&Number.isInteger(ans)&&!Number.isInteger(v))return}
    const k=fmt(v);if(seen.has(k))return;seen.add(k);out.push({v,k})};
  for(const w of R.shuffle(wrongs)){if(out.length>=4)break;push(w)}
  if(isN){const st=Number.isInteger(ans)?Math.max(1,Math.round(ans/12)):(ans<1?0.02:0.5);
    for(let d=1;out.length<4&&d<80;d++){push(ans+d*st);if(out.length<4)push(ans-d*st)}
    const all=[{v:ans,k:A},...out].sort((x,y)=>x.v-y.v);return{opts:all.map(o=>o.k),ans:A}}
  return{opts:R.shuffle([A,...out.map(o=>o.k)]),ans:A}}
const fixed=(opts,ans)=>({opts,ans});
/* 문항 은행: [문제, 정답, [오답…], 풀이] 중 하나를 골라 보기 순서를 섞는다 */
function bank(id,u,name,lv,items){return{id,u,name,lv,bank:true,n:items.length,g:R=>{const it=R.pick(items);return{q:it[0],...mc(R,it[1],it[2]),exp:it[3]}}}}

/* ===== 그림(SVG) ===== */
const f1=v=>Math.round(v*10)/10;
function angOf(P,Q){let a=Math.atan2(-(Q[1]-P[1]),Q[0]-P[0])*180/Math.PI;return (a+360)%360}
function arcAt(P,Q1,Q2,r){let a1=angOf(P,Q1),a2=angOf(P,Q2);if(a2<a1)a2+=360;const t=x=>x*Math.PI/180;
  const s=[P[0]+r*Math.cos(t(a1)),P[1]-r*Math.sin(t(a1))],e=[P[0]+r*Math.cos(t(a2)),P[1]-r*Math.sin(t(a2))];
  return `<path class="arc" d="M${f1(s[0])} ${f1(s[1])}A${r} ${r} 0 ${a2-a1>180?1:0} 0 ${f1(e[0])} ${f1(e[1])}"/>`}
const txt=(s,x,y,anc,cls)=>`<text x="${x}" y="${y}"${anc?` text-anchor="${anc}"`:''}${cls?` class="${cls}"`:''}>${s}</text>`;
const svg=(w,h,body)=>`<svg viewBox="0 0 ${w} ${h}" role="img">${body}</svg>`;
function figSeg(aLab){const A=[30,60],N=[95,60],M=[160,60],B=[290,60];
  return svg(320,105,`<path class="ln" d="M30 60H290"/>${[A,N,M,B].map(p=>`<circle class="dot" cx="${p[0]}" cy="60" r="3.2"/>`).join('')}
  <path class="arc" d="M62.5 55V65 M127.5 55V65"/><path class="arc" d="M222 55V65 M228 55V65"/>
  ${txt('A',30,44,'middle','v')}${txt('N',95,44,'middle','v')}${txt('M',160,44,'middle','v')}${txt('B',290,44,'middle','v')}
  <path class="ln dash" d="M30 78V92H290V78"/>${txt(aLab,160,100,'middle')}`)}
function figVert(e1,e2){const C=[160,95],L1a=[40,40],L1b=[280,150],L2a=[60,170],L2b=[260,20];
  return svg(320,190,`<path class="ln" d="M40 40L280 150M60 170L260 20"/>${arcAt(C,L1a,L2a,22)}${arcAt(C,L1b,L2b,22)}${txt(e1,132,104,'end')}${txt(e2,196,97)}`)}
function figPar(L){const P=[[145,60],[215,150]],T1=[110,15],T2=[250,195];
  const off={ur:[22,-10,'start'],ul:[-22,-10,'end'],dr:[26,22,'start'],dl:[-22,22,'end']};
  const dirs=P.map(p=>({R:[p[0]+50,p[1]],Lf:[p[0]-50,p[1]],U:T1,D:T2}));
  const wedge={ur:['R','U'],ul:['U','Lf'],dl:['Lf','D'],dr:['D','R']};
  let s=`<path class="ln" d="M20 60H300M20 150H300M110 15L250 195"/>${txt('l',24,52,'','v')}${txt('m',24,142,'','v')}`;
  for(const l of L){const p=P[l.pt-1],o=off[l.pos],w=wedge[l.pos],d=dirs[l.pt-1];
    s+=arcAt(p,d[w[0]],d[w[1]],15)+txt(l.t,p[0]+o[0],p[1]+o[1],o[2])}
  return svg(330,205,s)}
function figCuboid(){return svg(300,190,`<path class="ln" d="M60 60H190V160H60Z M60 60L110 25H240L190 60 M240 25V125L190 160"/><path class="ln dash" d="M110 25V125H240 M110 125L60 160"/>
  ${[['A',48,62],['B',196,74],['C',248,24],['D',100,20],['E',48,174],['F',196,176],['G',248,132],['H',98,124]].map(a=>txt(a[0],a[1],a[2],'','v')).join('')}`)}
function figPrism(){return svg(280,190,`<path class="ln" d="M70 45L190 55L140 20Z M70 45V155 M190 55V165 M70 155L190 165"/><path class="ln dash" d="M140 20V130 M70 155L140 130L190 165"/>
  ${[['A',56,46],['B',196,58],['C',134,14],['D',56,162],['E',196,174],['F',146,128]].map(a=>txt(a[0],a[1],a[2],'','v')).join('')}`)}
function figTri(la,lb,le){const A=[150,20],B=[30,170],C=[230,170],E=[320,170];
  return svg(330,192,`<path class="ln" d="M150 20L30 170H320M150 20L230 170"/>${arcAt(A,B,C,18)}${arcAt(B,C,A,22)}${arcAt(C,E,A,20)}
  ${txt('A',150,14,'middle','v')}${txt('B',22,186,'middle','v')}${txt('C',230,188,'middle','v')}
  ${txt(la,146,78,'middle')}${txt(lb,60,158)}${txt(le,256,158)}`)}
function figSector(th,rl,tl){const c=[150,120],r=85,t=x=>x*Math.PI/180;const a1=90-th/2,a2=90+th/2;
  const p=a=>[f1(c[0]+r*Math.cos(t(a))),f1(c[1]-r*Math.sin(t(a)))];const P1=p(a1),P2=p(a2);
  const mid=[(c[0]+P2[0])/2,(c[1]+P2[1])/2];const dl=th<90?52:th<=180?30:24;
  return svg(300,215,`<path class="sh" d="M${c[0]} ${c[1]}L${P1[0]} ${P1[1]}A${r} ${r} 0 ${th>180?1:0} 0 ${P2[0]} ${P2[1]}Z"/>${arcAt(c,P1,P2,14)}
  <circle class="dot" cx="150" cy="120" r="2.6"/>${txt('O',150,138+(th>180?-30:0),'middle','v')}
  ${tl?txt(tl,150,120-dl,'middle'):''}${rl?txt(rl,f1(mid[0]-8),f1(mid[1]+(th>180?16:-4)),'end'):''}`)}
function figCyl(rl,hl){return svg(300,195,`<ellipse class="ln" cx="150" cy="40" rx="70" ry="16"/><path class="ln" d="M80 40V160M220 40V160M80 160A70 16 0 0 0 220 160M150 40H220"/><path class="ln dash" d="M80 160A70 16 0 0 1 220 160"/><circle class="dot" cx="150" cy="40" r="2.4"/>
  ${txt(rl,185,32,'middle')}${txt(hl,228,104)}`)}
function figCone(rl,side,isSlant){return svg(300,190,`<path class="ln" d="M150 25L80 160M150 25L220 160M80 160A70 16 0 0 0 220 160M150 160H220"/><path class="ln dash" d="M80 160A70 16 0 0 1 220 160${isSlant?'':'M150 25V160'}"/><circle class="dot" cx="150" cy="160" r="2.4"/>
  ${txt(rl,185,153,'middle')}${isSlant?txt(side,192,92):txt(side,156,100)}`)}
function figSph(rl){return svg(300,190,`<circle class="ln" cx="150" cy="95" r="75"/><path class="ln" d="M75 95A75 18 0 0 0 225 95M150 95H225"/><path class="ln dash" d="M75 95A75 18 0 0 1 225 95"/><circle class="dot" cx="150" cy="95" r="2.4"/>${txt(rl,188,88,'middle')}`)}

/* ===== 과목 데이터 ===== */
const SUBJ={};const SEMS={'1-2':SUBJ,'2-1':{},'2-2':{}};const SEMNAME={'1-2':['중1','2학기','2026학년도 2학기 · 기말고사 대비'],'2-1':['중2','1학기','2027학년도 1학기 · 중간·기말고사 대비'],'2-2':['중2','2학기','2027학년도 2학기 · 중간·기말고사 대비']};let _T=[];const add=o=>_T.push(o);
/* ===== 수학 (동아 수학 1 · 2학기) ===== */
_T=[];
/* Ⅰ-1 점·선·면·각 */
add({id:'a1-mid',u:'A1',name:'중점과 선분의 길이',lv:1,g:R=>{const k=R.i(2,9),a=4*k,ans=3*k;
 return{q:`그림에서 점 M은 ${sg('AB')}의 중점이고, 점 N은 ${sg('AM')}의 중점이다. ${sg('AB')} = ${a} cm일 때, ${sg('NB')}의 길이는?`,
 fig:figSeg(`${a} cm`),alt:`선분 AB 위에 A, N, M, B 순서로 점이 있음`,...mc(R,ans,[k,2*k,a,5*k,ans+1],v=>v+' cm'),
 exp:`${sg('AM')} = ${sg('MB')} = ${fr(a,2)} = ${2*k} (cm)<br>${sg('NM')} = ${fr(2*k,2)} = ${k} (cm)<br>∴ ${sg('NB')} = ${sg('NM')} + ${sg('MB')} = ${k} + ${2*k} = <b>${ans} cm</b>`}}});
add({id:'a1-vert',u:'A1',name:'맞꼭지각',lv:1,g:R=>{const x=R.i(15,40),a=R.i(5,x-5),b=x-a;const e1=`(2x + ${a})°`,e2=`(3x − ${b})°`;
 return{q:`그림과 같이 두 직선이 한 점에서 만날 때, x의 값은?`,fig:figVert(e1,e2),alt:`맞꼭지각 ${e1}, ${e2}`,
 ...mc(R,x,[Math.abs(a-b),x+5,x-5,2*x,a],String),exp:`맞꼭지각의 크기는 서로 같으므로<br>2x + ${a} = 3x − ${b} &nbsp;∴ x = <b>${x}</b>`}}});
add({id:'a1-flat',u:'A1',name:'평각과 각의 크기의 비',lv:1,g:R=>{let p,q,r,s;do{p=R.i(1,5);q=R.i(2,6);r=R.i(2,8);s=p+q+r}while(180%s||p===q||q===r||p===r);
 const u=180/s,m=Math.max(p,q,r),mn=Math.min(p,q,r),ans=m*u;
 return{q:`평각을 세 각 ∠a, ∠b, ∠c로 나누었더니 ∠a : ∠b : ∠c = ${p} : ${q} : ${r}이었다. 가장 큰 각의 크기는?`,
 ...mc(R,ans,[mn*u,(s-m-mn)*u,ans+u,90,ans-u],v=>v+'°'),exp:`평각의 크기는 180°이므로 가장 큰 각의 크기는<br>180° × ${fr(m,s)} = <b>${ans}°</b>`}}});
add({id:'a1-pv',u:'A1',name:'교점과 교선의 개수',lv:1,g:R=>{const n=R.i(3,8),k=R.pick(['기둥','뿔']);const V=k==='기둥'?2*n:n+1,E=k==='기둥'?3*n:2*n,F=k==='기둥'?n+2:n+1,ans=V+E;
 return{q:`${NUM[n]}각${k}에서 교점의 개수를 a, 교선의 개수를 b라 할 때, a + b의 값은?`,...mc(R,ans,[V+F,E+F,ans+n,ans-n,ans+2],String),
 exp:`교점의 개수는 꼭짓점의 개수와 같으므로 a = ${V}<br>교선의 개수는 모서리의 개수와 같으므로 b = ${E}<br>∴ a + b = <b>${ans}</b>`}}});
add({id:'a1-line',u:'A1',name:'직선·반직선·선분의 개수',lv:2,g:R=>{const n=R.i(4,7),c=n*(n-1)/2;const k=R.pick(['직선','반직선','합']);
 const ans=k==='직선'?c:k==='반직선'?2*c:4*c;const ask=k==='합'?'만들 수 있는 서로 다른 직선, 반직선, 선분의 개수를 각각 a, b, c라 할 때, a + b + c의 값은?':`만들 수 있는 서로 다른 ${k}의 개수는?`;
 return{q:`어느 세 점도 한 직선 위에 있지 않은 ${n}개의 점이 있다. 이 중 두 점을 이어 ${ask}`,...mc(R,ans,[c,2*c,3*c,4*c,c+n,n*n],String),
 exp:`두 점을 고르는 방법은 ${fr(`${n}*${n-1}`,2)} = ${c}(가지)<br>직선 = 선분 = ${c}개, 반직선은 방향이 2가지이므로 ${2*c}개<br>∴ <b>${ans}</b>`}}});

/* Ⅰ-2 위치 관계 */
add({id:'a2-par',u:'A2',name:'평행선의 성질',lv:2,g:R=>{const k=R.pick(['동위각','엇각','같은 쪽 내각']);let x,p,q,a,b,e1,e2,L;
 if(k!=='같은 쪽 내각'){do{x=R.i(10,30);p=R.i(1,3);q=p+R.i(1,2);a=R.i(5,(q-p)*x-5);b=(q-p)*x-a}while(p*x+a>=170);
   e1=`(${ex(p,a)})°`;e2=`(${ex(q,-b)})°`;
   L=k==='동위각'?R.pick([[['ur',1],['ur',2]],[['dl',1],['dl',2]]]):R.pick([[['dl',1],['ur',2]],[['dr',1],['ul',2]]]);}
 else{let rest;do{x=R.i(10,30);p=R.i(1,3);q=R.i(1,3);rest=180-(p+q)*x}while(rest<10);a=R.i(0,rest);b=rest-a;
   e1=`(${ex(p,a)})°`;e2=`(${ex(q,b)})°`;L=R.pick([[['dr',1],['ur',2]],[['dl',1],['ul',2]]]);}
 const fig=figPar([{t:e1,pos:L[0][0],pt:1},{t:e2,pos:L[1][0],pt:2}]);
 const exp=k==='같은 쪽 내각'?`한 각의 동위각과 다른 한 각이 평각을 이루므로 두 각의 크기의 합은 180°이다.<br>(${ex(p,a)}) + (${ex(q,b)}) = 180 &nbsp;→&nbsp; ${p+q}x = ${(p+q)*x} &nbsp;∴ x = <b>${x}</b>`
   :`l ∥ m이면 ${k}의 크기는 같으므로<br>${ex(p,a)} = ${ex(q,-b)} &nbsp;∴ x = <b>${x}</b>`;
 return{q:`그림에서 l ∥ m일 때, x의 값은?`,fig,alt:`평행선 l, m과 한 직선이 만나 생기는 ${k}: ${e1}, ${e2}`,...mc(R,x,[x+5,x-5,2*x,x+10,Math.round(x/2)],String),exp}}});
const SKEW=[

 return{q:`학생 5명의 수학 점수의 평균이 ${m1}점이다. 한 명이 더 들어와 6명의 평균이 ${m2}점이 되었을 때, 새로 들어온 학생의 점수는?`,...mc(R,x,[m2,m1+m2-m1,6*m2-6*m1,x+6,x-6],v=>v+'점'),
 exp:`(5명의 총점) = ${m1} × 5 = ${5*m1}, (6명의 총점) = ${m2} × 6 = ${6*m2}<br>∴ ${6*m2} − ${5*m1} = <b>${x}점</b>`}}});
add({id:'d1-which',u:'D1',name:'알맞은 대푯값 고르기',lv:2,g:R=>{
 if(R.f()<.5){const v=[...Array(6)].map(()=>R.i(35,70));v.push(R.i(300,480));const d=R.shuffle(v);
  return{q:`다음은 학생 7명의 하루 스마트폰 사용 시간(분)이다. 이 자료의 대푯값으로 가장 적절한 것은?<div class="data">${d.join(', ')}</div>`,...fixed(['평균','중앙값','최빈값','가장 큰 값','가장 작은 값'],'중앙값'),
  exp:`${Math.max(...v)}처럼 다른 값과 크게 차이 나는 값이 있으면 평균이 그 값의 영향을 크게 받는다. 이때는 <b>중앙값</b>이 대푯값으로 적절하다.`}}
 return{q:`티셔츠 가게에서 다음 달에 가장 많이 주문할 크기를 정하려고 한다. 지난달 판매한 티셔츠 크기 자료의 대푯값으로 가장 적절한 것은?`,...fixed(['평균','중앙값','최빈값','가장 큰 값','가장 작은 값'],'최빈값'),
 exp:`가장 많이 팔린 크기를 알아야 하므로 자료에서 가장 많이 나타나는 값인 <b>최빈값</b>이 적절하다. 옷이나 신발의 크기처럼 선호도를 조사할 때 주로 쓴다.`}}});

/* Ⅳ-2 도수분포표와 그래프 */
const FCTX=[{t:'1학년 학생들의 수학 점수',pt:'를',lab:'점수(점)',u:'점',s:50,w:10},{t:'1학년 학생들의 키',pt:'를',lab:'키(cm)',u:'cm',s:140,w:5},{t:'학생들의 하루 운동 시간',pt:'을',lab:'운동 시간(분)',u:'분',s:0,w:10},{t:'학생들의 통학 시간',pt:'을',lab:'통학 시간(분)',u:'분',s:0,w:5}];
function ftab(R){const c=R.pick(FCTX),N=R.pick([20,25,50]);let f;
 for(let k=0;k<40;k++){const wt=[R.i(1,3),R.i(2,5),R.i(3,7),R.i(2,5),R.i(1,3)],W=wt.reduce((a,b)=>a+b);f=wt.map(x=>Math.max(1,Math.round(x*N/W)));const mi=f.indexOf(Math.max(...f));f[mi]+=N-f.reduce((a,b)=>a+b);if(f.every(x=>x>=1))break}
 return{...c,N,f}}
const cls=(F,i)=>`${F.s+i*F.w} 이상 ~ ${F.s+(i+1)*F.w} 미만`;
const ftHTML=(F,blank)=>`<div class="tw"><table class="ft"><thead><tr><th>${F.lab}</th><th>도수(명)</th></tr></thead><tbody>${F.f.map((x,i)=>`<tr><td>${cls(F,i)}</td><td>${i===blank?'A':x}</td></tr>`).join('')}<tr class="tot"><td>합계</td><td>${F.N}</td></tr></tbody></table></div>`;
const intro=F=>`다음은 ${F.t}${F.pt} 조사하여 나타낸 도수분포표이다.`;
add({id:'d2-rel',u:'D2',name:'상대도수',lv:1,g:R=>{const F=ftab(R),i=R.i(0,4),f=F.f[i],ans=r3(f/F.N);
 return{q:`${intro(F)} ${cls(F,i)}인 계급의 상대도수는?${ftHTML(F)}`,...mc(R,ans,[r3(f/100),r3((f+1)/F.N),r3((f-1)/F.N),r3(F.f[(i+1)%5]/F.N),r3(2*f/F.N)],String),
 exp:`(상대도수) = ${fr('(그 계급의 도수)','(도수의 총합)')} = ${fr(f,F.N)} = <b>${ans}</b>`}}});
add({id:'d2-blank',u:'D2',name:'도수분포표의 빈칸',lv:1,g:R=>{const F=ftab(R),i=R.i(0,4),A=F.f[i];
 return{q:`${intro(F)} A의 값은?${ftHTML(F,i)}`,...mc(R,A,[A+1,A-1,A+2,A-2,A+3],String),exp:`A = ${F.N} − (${F.f.filter((_,j)=>j!==i).join(' + ')}) = <b>${A}</b>`}}});
add({id:'d2-pct',u:'D2',name:'○ 이상/미만의 비율(%)',lv:2,g:R=>{const F=ftab(R),up=R.f()<.5;const i=up?R.i(2,4):R.i(1,3);const sum=up?F.f.slice(i).reduce((a,b)=>a+b):F.f.slice(0,i).reduce((a,b)=>a+b);const b=F.s+i*F.w,ans=sum*100/F.N;
 return{q:`${intro(F)} ${F.lab.split('(')[0]}이(가) ${b}${F.u} ${up?'이상':'미만'}인 학생은 전체의 몇 %인가?${ftHTML(F)}`,...mc(R,ans,[sum,100-ans,ans+(100/F.N),ans-(100/F.N),ans+10],v=>v+'%'),
 exp:`${b}${F.u} ${up?'이상':'미만'}인 학생 수 = ${up?F.f.slice(i).join(' + '):F.f.slice(0,i).join(' + ')} = ${sum}(명)<br>${fr(sum,F.N)} × 100 = <b>${ans}%</b>`}}});
add({id:'d2-hist',u:'D2',name:'히스토그램의 넓이',lv:2,g:R=>{const F=ftab(R),ans=F.w*F.N;
 return{q:`${intro(F)} 이 도수분포표를 히스토그램으로 나타낼 때, 모든 직사각형의 넓이의 합은?${ftHTML(F)}`,...mc(R,ans,[F.N,ans/2,2*ans,F.N+F.w,F.w*5],String),
 exp:`(직사각형의 넓이의 합) = (계급의 크기) × (도수의 총합) = ${F.w} × ${F.N} = <b>${ans}</b>`}}});
add({id:'d2-top',u:'D2',name:'도수가 가장 큰 계급',lv:1,g:R=>{let F;do{F=ftab(R)}while(F.f.filter(x=>x===Math.max(...F.f)).length>1);const i=F.f.indexOf(Math.max(...F.f));const opts=F.f.map((_,j)=>cls(F,j));
 return{q:`${intro(F)} 도수가 가장 큰 계급은?${ftHTML(F)}`,...fixed(opts,opts[i]),exp:`도수가 ${F.f[i]}명으로 가장 큰 계급은 <b>${opts[i]}</b>`}}});
add({id:'d2-inv',u:'D2',name:'상대도수로 총합 구하기',lv:2,g:R=>{const N=R.pick([20,25,40,50]);let f;do{f=R.i(2,Math.floor(N/2))}while(String(r3(f/N)).length>5);const r=r3(f/N);
 return{q:`어떤 도수분포표에서 도수가 ${f}명인 계급의 상대도수가 ${r}일 때, 도수의 총합은?`,...mc(R,N,[N/2,2*N,N+5,N-5,f*10],v=>v+'명'),exp:`(도수의 총합) = ${fr('(그 계급의 도수)','(상대도수)')} = ${fr(f,r)} = <b>${N}명</b>`}}});

SUBJ.math={name:'수학',book:'동아 수학 1 · 2학기 (2022 개정)',T:_T,
 units:[{id:'I',tag:'I',name:'기본 도형',subs:[['A1','점·선·면·각'],['A2','위치 관계'],['A3','작도와 합동']]},
  {id:'II',tag:'II',name:'평면도형의 성질',subs:[['B1','다각형'],['B2','원과 부채꼴']]},
  {id:'III',tag:'III',name:'입체도형의 성질',subs:[['C1','다면체와 회전체'],['C2','겉넓이와 부피']]},
  {id:'IV',tag:'IV',name:'자료의 정리와 해석',subs:[['D1','대푯값'],['D2','도수분포표와 그래프']]}],
 presets:[['2학기 전체',null],['Ⅱ~Ⅳ',['B1','B2','C1','C2','D1','D2']],['Ⅲ~Ⅳ',['C1','C2','D1','D2']]]};

/* ===== 수학 심화(그림형) — 실제 시험 상 문항 유형을 본뜬 자체 제작 ===== */
const NTS='<span class="tag">(단, 그림은 실제 크기·각도와 다를 수 있다.)</span>';
const R2D=Math.PI/180;
function angMark(V,P1,P2,r,label,dist){let a1=angOf(V,P1),a2=angOf(V,P2);if(((a2-a1+360)%360)>180){[P1,P2]=[P2,P1];a1=angOf(V,P1);a2=angOf(V,P2)}if(a2<a1)a2+=360;const m=(a1+a2)/2*R2D;
 return arcAt(V,P1,P2,r)+(label?txt(label,f1(V[0]+dist*Math.cos(m)),f1(V[1]-dist*Math.sin(m)+4),'middle'):'')}
const pt=(p,cls)=>`<circle class="${cls||'dot'}" cx="${f1(p[0])}" cy="${f1(p[1])}" r="2.6"/>`;
const poly=(ps,cls,close)=>`<path class="${cls||'ln'}" d="M${ps.map(p=>f1(p[0])+' '+f1(p[1])).join('L')}${close?'Z':''}"/>`;
const piS=(p,q,sgn,u)=>`(${p===1?'':p}π ${sgn} ${q}) ${u}`;   // (pπ ± q) 단위
const piR=(q,p,u)=>`(${q} − ${p===1?'':p}π) ${u}`;               // (q − pπ) 단위

/* --- 평행선: 꺾인 선 --- */
function figBend(a,b){const top=40,bot=170,ax=70,ta=Math.tan(a*R2D),tb=Math.tan(b*R2D),d=130/(ta+tb),A=[ax,top],B=[ax,bot],P=[ax+d,top+d*ta];
 return svg(330,205,`<path class="ln" d="M20 40H310M20 170H310"/>${poly([A,P,B])}${txt('l',300,32,'','v')}${txt('m',300,162,'','v')}${txt('A',ax-6,30,'middle','v')}${txt('B',ax-6,190,'middle','v')}${txt('P',P[0]+12,P[1]+4,'','v')}
 ${angMark(A,[ax+60,top],P,18,a+'°',36)}${angMark(B,[ax+60,bot],P,18,b+'°',36)}${angMark(P,A,B,16,'x',34)}`)}
add({id:'a2-bend',u:'A2',name:'[심화] 평행선과 꺾인 선',lv:3,g:R=>{const a=R.i(25,60),b=R.i(25,60),x=a+b;
 return{q:`그림에서 l ∥ m일 때, ∠x의 크기는? ${NTS}`,fig:figBend(a,b),alt:`평행선 l, m 사이에서 꺾인 선 A–P–B, ∠A=${a}°, ∠B=${b}°, ∠P=x`,...mc(R,x,[180-x,Math.abs(a-b),x+10,2*x>180?x-10:2*x,180-a],v=>v+'°'),
 exp:`점 P를 지나고 l에 평행한 직선을 그으면, 엇각의 성질에 의해 ∠x는 위쪽 엇각 ${a}°와 아래쪽 엇각 ${b}°로 나뉜다.<br>∴ ∠x = ${a}° + ${b}° = <b>${x}°</b>`}}});
function figZig(al,be,ga,lab){const h=130/3,t=v=>Math.tan(v*R2D);let A=[0,40],P=[h/t(al),40+h],Q=[h/t(al)-h/t(be),40+2*h],B=[h/t(al)-h/t(be)+h/t(ga),170];
 const xs=[0,P[0],Q[0],B[0]],sh=165-(Math.min(...xs)+Math.max(...xs))/2;[A,P,Q,B]=[A,P,Q,B].map(p=>[p[0]+sh,p[1]]);
 return svg(330,205,`<path class="ln" d="M15 40H315M15 170H315"/>${poly([A,P,Q,B])}${txt('l',305,32,'','v')}${txt('m',305,162,'','v')}
 ${angMark(A,[A[0]+60,40],P,16,lab[0],34)}${angMark(P,A,Q,14,lab[1],32)}${angMark(Q,P,B,14,lab[2],32)}${angMark(B,[B[0]-60,170],Q,16,lab[3],34)}`)}
add({id:'a2-zig',u:'A2',name:'[심화] 평행선과 두 번 꺾인 선',lv:3,g:R=>{const al=R.i(25,55),be=R.i(25,55),ga=R.i(25,55),p=al+be,x=be+ga;
 return{q:`그림에서 l ∥ m일 때, ∠x의 크기는? ${NTS}`,fig:figZig(al,be,ga,[al+'°',p+'°','x',ga+'°']),alt:`평행선 사이 두 번 꺾인 선: 위 ${al}°, 첫 꺾인 점 ${p}°, 둘째 꺾인 점 x, 아래 ${ga}°`,
 ...mc(R,x,[al+ga,p+al+ga,Math.abs(p-ga),x+10,180-x],v=>v+'°'),
 exp:`꺾인 점마다 l에 평행한 보조선을 그으면, 오른쪽으로 꺾인 각의 합과 왼쪽으로 꺾인 각의 합이 같다.<br>${al}° + x = ${p}° + ${ga}° &nbsp;∴ x = <b>${x}°</b>`}}});

/* --- 다각형: 별 모양, 맞꼭지각을 낀 두 삼각형 --- */
function figStar(labs){const c=[165,112],r=95,V=[0,1,2,3,4].map(k=>[c[0]+r*Math.cos((90+72*k)*R2D),c[1]-r*Math.sin((90+72*k)*R2D)]);const ord=[0,2,4,1,3];
 return svg(330,215,`${poly(ord.map(i=>V[i]),'ln',true)}${V.map((v,i)=>txt(labs[i],f1(v[0]+(c[0]-v[0])*0.28),f1(v[1]+(c[1]-v[1])*0.28+4),'middle')).join('')}`)}
add({id:'b1-star',u:'B1',name:'[심화] 별 모양 도형의 각',lv:3,g:R=>{let v,x;do{v=[0,1,2,3].map(()=>R.i(24,44));x=180-v.reduce((a,b)=>a+b)}while(x<20||x>60);const pos=R.i(0,4),labs=[];let k=0;for(let i=0;i<5;i++)labs.push(i===pos?'x':v[k++]+'°');
 return{q:`그림과 같은 별 모양의 도형에서 ∠x의 크기는? ${NTS}`,fig:figStar(labs),alt:`별 모양 도형의 다섯 꼭짓점 각: ${labs.join(', ')}`,...mc(R,x,[360-180-x>0?180-x:x+20,x+10,x-10,540/5-x>0?108-x:x+15,x+5],v=>v+'°'),
 exp:`별 모양 도형의 다섯 꼭짓점의 각의 크기의 합은 180°이다. (작은 삼각형의 외각 성질을 두 번 이용하면 다섯 각이 한 삼각형의 세 내각으로 모인다.)<br>x = 180° − (${v.join(' + ')})° = <b>${x}°</b>`}}});
function figBow(la,lb,lc,ld){const A=[50,35],B=[50,185],C=[290,35],D=[290,185],O=[170,110];
 return svg(340,210,`${poly([A,D])}${poly([B,C])}${poly([A,B])}${poly([C,D])}${txt('A',38,30,'middle','v')}${txt('B',38,200,'middle','v')}${txt('C',302,30,'middle','v')}${txt('D',302,200,'middle','v')}${txt('O',170,98,'middle','v')}
 ${angMark(A,B,O,18,la,36)}${angMark(B,A,O,18,lb,36)}${angMark(C,D,O,18,lc,36)}${angMark(D,C,O,18,ld,36)}`)}
add({id:'b1-bow',u:'B1',name:'[심화] 맞꼭지각을 낀 두 삼각형',lv:3,g:R=>{let a,b,c,d;do{a=R.i(40,80);b=R.i(40,80);c=R.i(40,80);d=a+b-c}while(d<30||d>95||d===c);
 return{q:`그림에서 두 선분 AD와 BC가 점 O에서 만날 때, ∠x의 크기는? ${NTS}`,fig:figBow(a+'°',b+'°',c+'°','x'),alt:`∠A=${a}°, ∠B=${b}°, ∠C=${c}°, ∠D=x (AD와 BC가 O에서 교차)`,...mc(R,d,[a+b,180-d,c,d+10,Math.abs(a-b)+c],v=>v+'°'),
 exp:`△OAB와 △OCD에서 ∠AOB = ∠COD(맞꼭지각)이므로 나머지 두 각의 합도 같다.<br>${a}° + ${b}° = ${c}° + x &nbsp;∴ x = <b>${d}°</b>`}}});

/* --- 원과 부채꼴: 색칠한 부분 --- */
function figLens(al){return svg(320,240,`<path class="sh" d="M60 15 A200 200 0 0 1 260 215 A200 200 0 0 1 60 15 Z"/><path class="ln" d="M60 15H260V215H60Z"/>${txt(al,160,234,'middle')}`)}
function figCorner(al){return svg(320,240,`<path class="sh" d="M60 15 A200 200 0 0 1 260 215 L260 15 Z"/><path class="ln" d="M60 15H260V215H60Z"/><path class="ln dash" d="M60 215L260 215"/>${pt([60,215])}${txt(al,160,234,'middle')}`)}
function figTrack(Ll,dl){return svg(330,170,`<path class="sh" d="M100 25H230A60 60 0 0 1 230 145H100A60 60 0 0 1 100 25Z"/><path class="ln dash" d="M100 25V145M230 25V145"/>${txt(Ll,165,18,'middle')}${txt(dl,108,90)}`)}
add({id:'b2-shade',u:'B2',name:'[심화] 색칠한 부분의 넓이·둘레',lv:3,g:R=>{const k=R.pick(['lens','lensP','corner','track']);
 if(k==='lens'||k==='lensP'){const a=2*R.i(2,7),p=a*a/2,q=a*a;
  if(k==='lensP')return{q:`그림은 한 변의 길이가 ${a} cm인 정사각형의 두 꼭짓점을 각각 중심으로 하는 두 사분원을 그린 것이다. 색칠한 부분의 둘레의 길이는?`,fig:figLens(`${a} cm`),alt:`한 변 ${a} cm 정사각형 안의 두 사분원이 겹친 부분`,
   ...mc(R,a,[a/2,2*a,a*a/2,a*4],piF('cm')),exp:`색칠한 부분의 둘레는 반지름 ${a} cm인 사분원의 호 2개이다.<br>(2π × ${a} × ${fr(1,4)}) × 2 = <b>${a}π cm</b>`};
  const ans=piS(p,q,'−','cm²');return{q:`그림은 한 변의 길이가 ${a} cm인 정사각형의 두 꼭짓점을 각각 중심으로 하는 두 사분원을 그린 것이다. 색칠한 부분의 넓이는?`,fig:figLens(`${a} cm`),alt:`한 변 ${a} cm 정사각형 안의 두 사분원이 겹친 부분`,
   ...mc(R,ans,[piS(p/2,q/2,'−','cm²'),piS(p,q/2,'−','cm²'),piS(p*2,q,'−','cm²'),piR(q,p/2,'cm²'),piS(p,q,'+','cm²')]),
   exp:`(사분원 넓이) − (직각삼각형 넓이)를 2배 한다.<br>{π × ${a}² × ${fr(1,4)} − ${fr(1,2)} × ${a} × ${a}} × 2 = (${p/2}π − ${q/2}) × 2 = <b>${ans}</b>`}}
 if(k==='corner'){const a=2*R.i(2,7),q=a*a,p=a*a/4,ans=piR(q,p,'cm²');

add({id:'c2-net',u:'C2',name:'[심화] 원뿔의 전개도',lv:3,g:R=>{const th=R.pick([60,72,90,120,135,144,150,180,216,240]);let l;do{l=R.i(4,15)}while((l*th)%360);const r=l*th/360;const k=R.pick(['angle','r','area']);

function stemHTML(d,unit){const st={};d.forEach(v=>(st[Math.floor(v/10)]=st[Math.floor(v/10)]||[]).push(v%10));const ks=Object.keys(st).map(Number).sort((a,b)=>a-b);

 if(k==='pct'){const b=R.pick([70,80]),c=d.filter(v=>v>=b).length,p=c*5;return{q:`${H}점수가 ${b}점 이상인 학생은 전체의 몇 %인가?`,...mc(R,p,[c,100-p,p+5,p-5,p+10],v=>v+'%'),exp:`${b}점 이상인 학생은 ${c}명이므로 ${fr(c,n)} × 100 = <b>${p}%</b>`}}
 const r=R.i(3,6),v=s[n-r];return{q:`${H}점수가 높은 쪽에서 ${r}번째인 학생의 점수는?`,...mc(R,v,[s[n-r+1],s[n-r-1],s[r-1],v+1,v-1].filter(x=>x!==v),x=>x+'점'),exp:`큰 값부터 세면 ${s.slice(n-r).reverse().join(', ')} → ${r}번째는 <b>${v}점</b>`}}});

add({id:'d2-histg',u:'D2',name:'[심화] 히스토그램 해석',lv:3,g:R=>{const F=ftab(R);const k=R.pick(['torn','pct','area']);const intro2=`다음은 ${F.t}${F.pt} 조사하여 나타낸 히스토그램이다.`;
 if(k==='torn'){const i=R.i(1,3),A=F.f[i];return{q:`${intro2} 일부가 찢어져 보이지 않는다. 전체 학생 수가 ${F.N}명일 때, ${cls(F,i)}인 계급의 도수는?`,fig:figHist(F,i),alt:`히스토그램 도수: ${F.f.map((v,j)=>j===i?'?':v).join(', ')} (계급 크기 ${F.w})`,

 const a=F.w*F.N;return{q:`${intro2} 이 히스토그램의 각 직사각형의 윗변의 중점을 차례로 이어 도수분포다각형을 그렸을 때, 도수분포다각형과 가로축으로 둘러싸인 부분의 넓이는?`,fig:figHist(F,-1),alt:`히스토그램 도수: ${F.f.join(', ')}, 계급 크기 ${F.w}`,...mc(R,a,[a/2,a*2,F.N,a+F.w],String),
  exp:`도수분포다각형과 가로축으로 둘러싸인 넓이 = 히스토그램의 직사각형 넓이의 합<br>= (계급의 크기) × (도수의 총합) = ${F.w} × ${F.N} = <b>${a}</b>`}}});
function part(R,N,k){let f;do{const w=[R.i(1,3),R.i(2,5),R.i(3,7),R.i(2,5),R.i(1,3)].slice(0,k),W=w.reduce((a,b)=>a+b);f=w.map(x=>Math.max(1,Math.round(x*N/W)));f[f.indexOf(Math.max(...f))]+=N-f.reduce((a,b)=>a+b)}while(f.some(x=>x<1));return f}

const CITY=[['런던',0,'경도 0°'],['파리',15,'동경 15°'],['카이로',30,'동경 30°'],['방콕',105,'동경 105°'],['시드니',150,'동경 150°'],['뉴욕',-75,'서경 75°'],['로스앤젤레스',-120,'서경 120°']];
add({id:'s1-time',u:'S1',name:'경도와 시차',lv:2,g:R=>{const c=R.pick(CITY);const diff=(135-c[1])/15;let t,o,day,dw;
 const fmtT=(d,h)=>`10월 ${15+d}일 ${h<12?'오전':'오후'} ${h%12}시`;
 const norm=x=>{const d=Math.floor(x/24);return[d,((x%24)+24)%24]};
 do{t=R.i(1,23);o=norm(t-diff);dw=norm(t+diff)}while(t===12||o[1]%12===0||dw[1]%12===0||(t-diff+1)%12===0||(t-diff-1)%12===0);
 const ans=fmtT(o[0],o[1]);const w=[fmtT(dw[0],dw[1]),fmtT(o[0],o[1]+1),fmtT(o[0],o[1]-1),fmtT(o[0]+(o[0]===0?-1:1),o[1])];
 return{q:`서울(동경 135° 표준 경선)이 ${fmtT(0,t)}일 때, ${c[0]}(${c[2]} 표준 경선)의 시각은? (단, 서머 타임은 고려하지 않는다.)`,...mc(R,ans,w),
 exp:`경도 15°마다 1시간의 시차가 생긴다. 두 지역의 경도 차는 ${Math.abs(135-c[1])}°이므로 ${Math.abs(diff)}시간 차이가 난다.<br>${diff>0?`${c[0]}은(는) 서울보다 서쪽에 있어 시각이 늦으므로 ${diff}시간을 뺀다.`:`${c[0]}은(는) 서울보다 동쪽에 있어 시각이 빠르므로 ${-diff}시간을 더한다.`} ∴ <b>${ans}</b>`}}});

 const pth=c=>`M${c.map(p=>f1(tx(p[0]))+' '+f1(ty(p[1]))).join('L')}`;let s=`<path class="ln" d="M${ox} 15V${oy}H${ox+W}"/>`;

add({id:'i4-run',u:'I4',name:'[심화] 프로그램 실행 결과',lv:3,g:R=>{const k=R.pick(['sum','cond','dbl','cnt']);const code=s=>`<div class="data code">${s}</div>`;

 ${txt('P',P[0],40,'middle','v')}${txt('Q',Q[0],188,'middle','v')}${txt('R',Rr[0],188,'middle','v')}${angMark(P,[P[0]+60,50],Q,18,a+'°',36)}${angMark(Rr,[Rr[0]+60,170],P,16,'x',32)}`)}

function chart(o){const ox=46,oy=o.h-34,W=o.w-ox-18,H=oy-16,X=x=>ox+(x-o.x0)/(o.x1-o.x0)*W,Y=y=>oy-(y-o.y0)/(o.y1-o.y0)*H;let s='';
 (o.xt||[]).forEach(v=>{s+=`<path class="ln" style="stroke-width:.4;opacity:.35" d="M${f1(X(v))} ${oy}V${16}"/>`+txt(v,X(v),oy+15,'middle')});
 (o.yt||[]).forEach(v=>{s+=`<path class="ln" style="stroke-width:.4;opacity:.35" d="M${ox} ${f1(Y(v))}H${ox+W}"/>`+txt(v,ox-5,Y(v)+4,'end')});
 s+=`<path class="ln" d="M${ox} 12V${oy}H${ox+W+8}"/>`+txt(o.xl||'',ox+W+6,oy-6,'end')+txt(o.yl||'',ox+4,10,'start');
 (o.series||[]).forEach(([pts,lab,dash])=>{s+=`<path class="arc${dash?' dash':''}" style="stroke-width:2" d="M${pts.map(p=>f1(X(p[0]))+' '+f1(Y(p[1]))).join('L')}"/>`;if(lab){const p=pts[pts.length-1];s+=txt(lab,X(p[0])-14,Math.max(Y(p[1])+(dash?-8:4),24),'end','v')}});
 (o.marks||[]).forEach(([x,y,l])=>{s+=pt([X(x),Y(y)])+(l?txt(l,X(x)+6,Y(y)-6,'start','v'):'')});
 return svg(o.w,o.h,s)}

 const desc=k==='cnt'?`${r}자리 자연수`:`${r}자리 홀수`;return{q:`${digits.join(', ')}의 숫자가 각각 하나씩 적힌 ${n}장의 카드 중에서 ${r}장을 뽑아 만들 수 있는 ${desc}의 개수는?`,...mc(R,cnt,[r===2?n*(n-1):n*(n-1)*(n-2),z?(n-1)*(n-1)*(r===3?n-2:1):n*n,cnt+n,cnt*2,cnt-(n-1)].filter(v=>v>0),v=>v+'개'),
 exp:`${z?'맨 앞자리에는 0이 올 수 없음에 주의한다.<br>':''}${k==='odd'?'일의 자리에 홀수가 오는 경우를 먼저 정하고 나머지 자리를 채운다.<br>':''}조건을 만족하는 수: <b>${cnt}개</b>`}}});
add({id:'n22-pick',u:'N8',name:'대표 뽑기',lv:2,g:R=>{const n=R.i(4,8),k=R.pick(['diff','same','three']);
 if(k==='diff'){const ans=n*(n-1);return{q:`${n}명의 후보 중에서 회장 1명, 부회장 1명을 뽑는 경우의 수는?`,...mc(R,ans,[ans/2,n*2,n*n,ans+n].filter(Number.isInteger),N_cnt),exp:`자격이 다른 대표: ${n} × ${n-1} = <b>${ans}가지</b>`}}
 if(k==='same'){const ans=n*(n-1)/2;return{q:`${n}명의 후보 중에서 대표 2명을 뽑는 경우의 수는?`,...mc(R,ans,[n*(n-1),n*2,ans+1,ans-1].filter(v=>v>0),N_cnt),exp:`자격이 같은 대표: (${n} × ${n-1}) ÷ 2 = <b>${ans}가지</b>`}}
 const ans=n*(n-1)*(n-2)/6;return{q:`${n}명의 학생 중에서 청소 당번 3명을 뽑는 경우의 수는?`,...mc(R,ans,[n*(n-1)*(n-2),n*(n-1)/2,ans*2,ans+n].filter(Number.isInteger),N_cnt),exp:`자격이 같은 3명: (${n} × ${n-1} × ${n-2}) ÷ (3 × 2 × 1) = <b>${ans}가지</b>`}}});
add({id:'n22-coin',u:'N8',name:'동전과 주사위',lv:1,g:R=>{const c=R.i(1,3),d=R.i(0,2);if(c+d<2)return null;const ans=2**c*6**d;const what=[c?`동전 ${c}개`:'',d?`주사위 ${d}개`:''].filter(Boolean).join('와 ');
 return{q:`${what}를 동시에 던질 때, 일어나는 모든 경우의 수는?`,...mc(R,ans,[2*c+6*d,2**c+6**d,ans/2,ans*2].filter(v=>Number.isInteger(v)&&v>0),N_cnt),exp:`동전 1개: 2가지, 주사위 1개: 6가지 → 곱의 법칙<br>${[...Array(c).fill(2),...Array(d).fill(6)].join(' × ')} = <b>${ans}가지</b>`}}});
add({id:'n22-color',u:'N8',name:'[심화] 영역 색칠하기',lv:3,g:R=>{const n=R.pick([3,4,5]),shape=R.pick(['row','band']);let ans,fig,desc;
 if(shape==='row'){ans=n*(n-1)**3;fig=svg(320,90,['A','B','C','D'].map((l,i)=>`<rect class="ln" x="${30+i*65}" y="20" width="65" height="50"/>`+txt(l,62+i*65,50,'middle','v')).join(''));desc='그림과 같이 한 줄로 놓인 네 영역 A, B, C, D'}
 else{ans=n*(n-1)*(n-2)*(n-2);fig=svg(300,170,`<rect class="ln" x="30" y="20" width="240" height="55"/><rect class="ln" x="30" y="75" width="80" height="75"/><rect class="ln" x="110" y="75" width="80" height="75"/><rect class="ln" x="190" y="75" width="80" height="75"/>`+txt('C',150,53,'middle','v')+txt('A',70,118,'middle','v')+txt('B',150,118,'middle','v')+txt('D',230,118,'middle','v'));desc='그림의 네 영역 A, B, C, D'}
 return{q:`${desc}에 ${n}가지 색을 칠하려고 한다. 같은 색을 여러 번 써도 되지만 이웃한 영역은 서로 다른 색을 칠하는 경우의 수는?`,fig,alt:desc,...mc(R,ans,[n**4,n*(n-1)*(n-2)*(n-3),N_fact(n),ans+n,n*(n-1)*(n-1)*(n-2),n*(n-1)*(n-2)*(n-1)].filter(v=>Number.isInteger(v)&&v>0&&v!==ans),N_cnt),
 exp:shape==='row'?`A: ${n}가지, B: A와 다른 색 ${n-1}가지, C: B와 다른 색 ${n-1}가지, D: C와 다른 색 ${n-1}가지<br>${n} × ${n-1} × ${n-1} × ${n-1} = <b>${ans}가지</b>`:`가장 많은 영역과 이웃한 C부터 칠한다: C ${n}가지, B(C와 다름) ${n-1}가지, A(B·C와 다름) ${n-2}가지, D(B·C와 다름) ${n-2}가지<br>${n} × ${n-1} × ${n-2} × ${n-2} = <b>${ans}가지</b>`}}});
add({id:'n22-path',u:'N8',name:'[심화] 최단 경로의 수',lv:3,g:R=>{const w=R.i(2,4),h=R.i(2,3);const k=R.pick(['all','via']);const C=(n,r)=>{let v=1;for(let i=0;i<r;i++)v=v*(n-i)/(i+1);return v};
 const px=k==='via'?R.i(1,w-1):0,py=k==='via'?R.i(1,h-1):0;const ans=k==='all'?C(w+h,w):C(px+py,px)*C(w-px+h-py,w-px);const s=50,ox=40,oy=30;
 let g='';for(let i=0;i<=w;i++)g+=`<path class="ln" d="M${ox+i*s} ${oy}V${oy+h*s}"/>`;for(let j=0;j<=h;j++)g+=`<path class="ln" d="M${ox} ${oy+j*s}H${ox+w*s}"/>`;
 g+=N_pt([ox,oy+h*s])+N_pt([ox+w*s,oy])+txt('A',ox-8,oy+h*s+14,'end','v')+txt('B',ox+w*s+8,oy-4,'','v')+(k==='via'?N_pt([ox+px*s,oy+(h-py)*s])+txt('P',ox+px*s+6,oy+(h-py)*s-6,'','v'):'');
 return{q:`그림과 같은 길이 있다. A 지점에서 B 지점까지 ${k==='via'?'P 지점을 거쳐 ':''}최단 거리로 가는 경우의 수는?`,fig:svg(ox*2+w*s,oy*2+h*s,g),alt:`가로 ${w}칸, 세로 ${h}칸${k==='via'?`, P(${px},${py})`:''}`,
 ...mc(R,ans,[C(w+h,w)+1,w*h,ans*2,w+h,k==='via'?C(w+h,w):ans+2].filter(v=>v!==ans),N_cnt),exp:k==='all'?`오른쪽 ${w}번, 위쪽 ${h}번을 나열하는 경우의 수 = 각 교차점에 도달하는 경우의 수를 차례로 더해 구하면 <b>${ans}가지</b>`:`A → P: ${C(px+py,px)}가지, P → B: ${C(w-px+h-py,w-px)}가지<br>곱의 법칙: <b>${ans}가지</b>`}}});

/* ===== Ⅴ-2 확률 ===== */
add({id:'n22-p1',u:'N9',name:'확률의 뜻',lv:1,g:R=>{const k=R.pick(['bead','dice','card']);
 if(k==='bead'){const r=R.i(2,7),b=R.i(2,7),w=R.i(1,5),t=R.pick(['빨간','파란']);const f=t==='빨간'?r:b,n=r+b+w;return{q:`주머니 속에 빨간 구슬 ${r}개, 파란 구슬 ${b}개, 흰 구슬 ${w}개가 들어 있다. 한 개를 꺼낼 때, ${t} 구슬이 나올 확률은?`,...mc(R,N_fr(f,n),[N_fr(f,n-f),N_fr(n-f,n),N_fr(1,n),N_fr(f,n+1),N_fr(1,3)].filter(x=>x!==N_fr(f,n))),exp:`전체 ${n}개 중 ${t} 구슬 ${f}개 → <b>${N_fr(f,n)}</b>`}}
 if(k==='dice'){const c=R.pick(['소수','3의 배수','6의 약수','4 이상']);const f={'소수':3,'3의 배수':2,'6의 약수':4,'4 이상':3}[c];return{q:`한 개의 주사위를 던질 때, ${c}의 눈이 나올 확률은?`,...mc(R,N_fr(f,6),[N_fr(f+1,6),N_fr(f-1,6),N_fr(6-f+1,6),N_fr(1,6),N_fr(f,5)].filter(x=>x!==N_fr(f,6))),exp:`6가지 중 ${c}: ${f}가지 → <b>${N_fr(f,6)}</b>`}}
 const n=R.pick([10,12,15,20,30]),m=R.pick([3,4,5]);const f=Math.floor(n/m);return{q:`1부터 ${n}까지의 자연수가 각각 하나씩 적힌 ${n}장의 카드 중에서 한 장을 뽑을 때, ${m}의 배수가 나올 확률은?`,...mc(R,N_fr(f,n),[N_fr(f+1,n),N_fr(1,m+1),N_fr(f-1,n),N_fr(n-f,n),N_fr(m,n)].filter(x=>x!==N_fr(f,n))),exp:`${m}의 배수: ${f}개 → ${fr(f,n)} = <b>${N_fr(f,n)}</b>`}}});
add({id:'n22-pnot',u:'N9',name:'어떤 사건이 일어나지 않을 확률',lv:2,g:R=>{const k=R.pick(['coin','pass','least']);
 if(k==='coin'){const c=R.i(2,4);const N=2**c;return{q:`동전 ${c}개를 동시에 던질 때, 적어도 한 개는 앞면이 나올 확률은?`,...mc(R,N_fr(N-1,N),[N_fr(1,N),N_fr(1,2),N_fr(c,N),N_fr(N-2,N)].filter(x=>x!==N_fr(N-1,N))),exp:`(적어도 한 개는 앞면) = 1 − (모두 뒷면) = 1 − ${fr(1,N)} = <b>${N_fr(N-1,N)}</b>`}}
 if(k==='pass'){const p=R.pick([[2,5],[3,4],[1,3],[3,5],[5,8],[4,7]]);return{q:`어떤 시험에 합격할 확률이 ${fr(p[0],p[1])}일 때, 불합격할 확률은?`,...mc(R,N_fr(p[1]-p[0],p[1]),[N_fr(p[0],p[1]),N_fr(1,p[1]),N_fr(p[1]-p[0],p[1]+1),N_fr(p[0],p[1]-p[0])].filter(x=>x!==N_fr(p[1]-p[0],p[1]))),exp:`1 − ${fr(p[0],p[1])} = <b>${N_fr(p[1]-p[0],p[1])}</b>`}}
 const b=R.i(2,4),g=R.i(2,4),n=b+g;const all=n*(n-1)/2,none=g*(g-1)/2;return{q:`남학생 ${b}명, 여학생 ${g}명 중에서 대표 2명을 뽑을 때, 적어도 한 명은 남학생이 뽑힐 확률은?`,...mc(R,N_fr(all-none,all),[N_fr(none,all),N_fr(b,n),N_fr(b*g,all),N_fr(all-none-1,all)].filter(x=>x!==N_fr(all-none,all))),
 exp:`전체: ${all}가지, 2명 모두 여학생: ${none}가지<br>1 − ${fr(none,all)} = <b>${N_fr(all-none,all)}</b>`}}});
add({id:'n22-pand',u:'N9',name:'두 사건이 동시에 일어날 확률',lv:2,g:R=>{const k=R.pick(['bags','shot','dice']);
 if(k==='bags'){const a=R.i(2,5),b=R.i(1,4),c=R.i(2,5),d=R.i(1,4);return{q:`A 주머니에는 흰 공 ${a}개, 검은 공 ${b}개, B 주머니에는 흰 공 ${c}개, 검은 공 ${d}개가 들어 있다. 두 주머니에서 각각 한 개씩 꺼낼 때, 두 공이 모두 흰 공일 확률은?`,
  ...mc(R,N_fr(a*c,(a+b)*(c+d)),[N_fr(a+c,a+b+c+d),N_fr(b*d,(a+b)*(c+d)),N_fr(a*c+b*d,(a+b)*(c+d)),N_fr(a,a+b)].filter(x=>x!==N_fr(a*c,(a+b)*(c+d)))),exp:`${fr(a,a+b)} × ${fr(c,c+d)} = <b>${N_fr(a*c,(a+b)*(c+d))}</b>`}}
 if(k==='shot'){const p=R.pick([[3,5],[2,3],[4,5],[3,4]]),q=R.pick([[1,2],[2,5],[3,5],[2,3]]);const t=R.pick(['both','one']);
  const v=t==='both'?N_fr(p[0]*q[0],p[1]*q[1]):N_fr(p[0]*(q[1]-q[0])+(p[1]-p[0])*q[0],p[1]*q[1]);return{q:`명중률이 각각 ${fr(p[0],p[1])}, ${fr(q[0],q[1])}인 두 선수가 동시에 한 발씩 쏠 때, ${t==='both'?'두 선수 모두 명중시킬':'한 선수만 명중시킬'} 확률은?`,
  ...mc(R,v,[N_fr(p[0]*q[0],p[1]*q[1]),N_fr((p[1]-p[0])*(q[1]-q[0]),p[1]*q[1]),N_fr(p[0]*q[1]+q[0]*p[1]-p[0]*q[0],p[1]*q[1]),N_fr(p[0]+q[0],p[1]+q[1])].filter(x=>x!==v)),
  exp:t==='both'?`${fr(p[0],p[1])} × ${fr(q[0],q[1])} = <b>${v}</b>`:`(A만) + (B만) = ${fr(p[0],p[1])} × ${fr(q[1]-q[0],q[1])} + ${fr(p[1]-p[0],p[1])} × ${fr(q[0],q[1])} = <b>${v}</b>`}}
 return{q:`동전 한 개와 주사위 한 개를 동시에 던질 때, 동전은 앞면이 나오고 주사위는 짝수의 눈이 나올 확률은?`,...mc(R,N_fr(1,4),[N_fr(1,2),N_fr(1,6),N_fr(1,12),N_fr(1,3),N_fr(3,4)]),exp:`${fr(1,2)} × ${fr(3,6)} = <b>${fr(1,4)}</b>`}}});
add({id:'n22-pdraw',u:'N9',name:'연속하여 꺼내기 (꺼낸 것을 넣을 때·넣지 않을 때)',lv:2,g:R=>{const a=R.i(2,5),b=R.i(2,5),n=a+b,back=R.pick([true,false]);const v=back?N_fr(a*a,n*n):N_fr(a*(a-1),n*(n-1));
 return{q:`주머니 속에 당첨 제비 ${a}개, 꽝 제비 ${b}개가 들어 있다. 한 개를 꺼내 확인하고 ${back?'다시 넣은 후':'다시 넣지 않고'} 또 한 개를 꺼낼 때, 두 번 모두 당첨 제비가 나올 확률은?`,...mc(R,v,[N_fr(a*a,n*n),N_fr(a*(a-1),n*(n-1)),N_fr(a,n),N_fr(2*a,n*n),N_fr(a*(a-1),n*n)].filter(x=>x!==v)),
 exp:back?`꺼낸 것을 다시 넣으므로 두 번째도 ${fr(a,n)}<br>${fr(a,n)} × ${fr(a,n)} = <b>${v}</b>`:`첫 번째: ${fr(a,n)}, 두 번째는 남은 ${n-1}개 중 당첨 ${a-1}개 → ${fr(a-1,n-1)}<br>${fr(a,n)} × ${fr(a-1,n-1)} = <b>${v}</b>`}}});

add({id:'n22-pdeep',u:'N9',name:'[심화] 주사위로 정하는 방정식·점의 이동',lv:3,g:R=>{const k=R.pick(['eq','move']);
 if(k==='eq'){const c=R.pick([6,8,12]);let f=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(c%a===0&&c/a===b)f++;// ax = ? 단순: 방정식 ax = b의 해가 ...
  let g=0;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(b%a===0)g++;const v=N_fr(g,36);
  return{q:`한 개의 주사위를 두 번 던져 처음 나온 눈의 수를 a, 두 번째 나온 눈의 수를 b라 할 때, 방정식 ax = b의 해가 정수일 확률은?`,...mc(R,v,[N_fr(g-2,36),N_fr(g+2,36),N_fr(6,36),N_fr(1,2),N_fr(g,30)].filter(x=>x!==v)),exp:`해 x = ${fr('b','a')}가 정수이려면 b가 a의 배수<br>a = 1: 6가지, a = 2: 3가지, a = 3: 2가지, a = 4, 5, 6: 각 1가지 → ${g}가지<br>${fr(g,36)} = <b>${v}</b>`}}
 const n=R.pick([2,3]);// 동전 앞면 +1, 뒷면 −1, n번 던져 위치 0? n=2: 0 으로 돌아올 확률 1/2; n=3: 위치 1일 확률 3/8
 const v=n===2?N_fr(1,2):N_fr(3,8);return{q:`수직선 위의 원점에 있는 점 P가 동전을 던져 앞면이 나오면 오른쪽으로 1만큼, 뒷면이 나오면 왼쪽으로 1만큼 움직인다. 동전을 ${n}번 던졌을 때, 점 P가 ${n===2?'원점':'1의 위치'}에 있을 확률은?`,
 ...mc(R,v,[N_fr(1,4),N_fr(1,8),N_fr(3,4),N_fr(5,8),N_fr(1,3)].filter(x=>x!==v)),exp:n===2?`(앞, 뒤), (뒤, 앞) 2가지 → ${fr(2,4)} = <b>${v}</b>`:`앞면 2번, 뒷면 1번: (앞앞뒤), (앞뒤앞), (뒤앞앞) 3가지 → <b>${fr(3,8)}</b>`}}});

add({id:'s22-edeep',u:'R7',name:'[심화] 직렬·병렬 회로에서 전류와 전압',lv:3,g:R=>{const k=R.pick(['ser','par']);const r1=R.pick([2,3,4,6]),r2=R.pick([4,6,8,12].filter(v=>v!==r1)),V=R.pick([12,24]);
 if(k==='ser'){const I=S22_r(V/(r1+r2)),V1=S22_r(I*r1);return{q:`저항이 ${r1} Ω, ${r2} Ω인 두 저항을 직렬로 연결하고 전체에 ${V} V의 전압을 걸었다. ${r1} Ω인 저항에 걸리는 전압은?`,...mc(R,V1,[V,S22_r(V/2),S22_r(V-V1),S22_r(V*r2/(r1+r2)),S22_r(V/r1)],v=>v+' V'),

 const I1=S22_r(V/r1),I2=S22_r(V/r2),T=S22_r(I1+I2);return{q:`저항이 ${r1} Ω, ${r2} Ω인 두 저항을 병렬로 연결하고 ${V} V의 전압을 걸었다. 전원 장치에서 흘러나오는 전체 전류의 세기는?`,...mc(R,T,[I1,I2,S22_r(V/(r1+r2)),S22_r(T*2),S22_r(I1*I2)],v=>v+' A'),

add({id:'s22-plx',u:'R8',name:'연주 시차와 별까지의 거리',lv:1,g:R=>{const k=R.pick(['d','p','cmp']);

 const stars=['A','B','C','D','E'].map(n=>[n,R.pick([0.01,0.02,0.05,0.1,0.2,0.25,0.5,0.8])]);const ps=stars.map(s=>s[1]);const mx=Math.max(...ps);if(ps.filter(v=>v===mx).length>1)return null;const ans=stars[ps.indexOf(mx)][0];

 if(k==='ratio'){const d=R.pick([1,2,3,5]);const ratio={1:'약 2.5배',2:'약 6.3배',3:'약 16배',5:'100배'}[d];const m1=R.i(-1,3),m2=m1+d;
  return{q:`${MS22(m1)}등급인 별은 ${MS22(m2)}등급인 별보다 몇 배 밝은가?`,...fixed(R.shuffle(['약 2.5배','약 6.3배','약 16배','100배',`${d}배`].filter((v,i,a)=>a.indexOf(v)===i).concat(d===1?['약 40배']:[]).slice(0,5)),ratio),exp:`1등급 차이 ≈ 2.5배, 5등급 차이 = 100배<br>등급 차이 ${d} → <b>${ratio}</b> (등급이 작을수록 밝다)`}}

const MS22=v=>String(v).replace(/^-/,'−');
add({id:'s22-absmag',u:'R8',name:'[심화] 겉보기 등급과 절대 등급',lv:3,g:R=>{const st=['A','B','C','D'].map(n=>{const M=R.i(-3,6),m=R.i(-1,6);return[n,m,M]});const k=R.pick(['real','far','near10']);
 const tab=`<div class="tw"><table class="ft"><tr><th>별</th>${st.map(s=>`<th>${s[0]}</th>`).join('')}</tr><tr><th>겉보기 등급</th>${st.map(s=>`<td>${MS22(s[1])}</td>`).join('')}</tr><tr><th>절대 등급</th>${st.map(s=>`<td>${MS22(s[2])}</td>`).join('')}</tr></table></div>`;
 const pick=(arr,f)=>{const v=arr.map(f),best=Math.max(...v);return v.filter(x=>x===best).length>1?null:arr[v.indexOf(best)][0]};
 let ans,q,exp;if(k==='real'){ans=pick(st,s=>-s[2]);q='실제로 가장 밝은 별은?';exp='실제 밝기는 절대 등급(10 pc 거리에 두었을 때의 등급)으로 비교한다. 절대 등급이 가장 작은 별'}
 else if(k==='far'){ans=pick(st,s=>s[1]-s[2]);q='지구에서 가장 멀리 있는 별은?';exp='(겉보기 등급 − 절대 등급) 값이 클수록 멀리 있다.'}
 else{const c=st.filter(s=>s[1]<s[2]);if(c.length!==1)return null;ans=c[0][0];q='지구로부터의 거리가 10 pc보다 가까운 별은?';exp='겉보기 등급 < 절대 등급이면 10 pc보다 가깝다(10 pc로 옮기면 더 어두워짐).'}

 if(samePos){const p=EE_D[w[0]][0],s=c.filter(x=>EE_D[x[0]][0]===p);if(s.length>=n)c=s.concat(R.shuffle(c.filter(x=>EE_D[x[0]][0]!==p)))}
 const out=[];for(const x of samePos?c:R.shuffle(c)){if(out.length>=n)break;if(out.every(y=>EE_ok(y[0],x[0])))out.push(x)}
 return samePos?R.shuffle(out.slice(0,n)):out}
function EE_types(code,list,pre){const L=list.filter(x=>EE_D[x[0]]),D=w=>EE_D[w[0]][1],P=w=>EE_POS[EE_D[w[0]][0]];
 const T=[];
 /* 하: 풀이 ↔ 단어 */
 T.push({id:pre+'-ee1',u:code,name:'영영 풀이 (기본)',lv:1,g:R=>{const w=R.pick(L),o=EE_wr(R,L,w,4);
  if(R.i(0,1))return{q:`다음 영영 풀이에 해당하는 단어는?<div class="psg">${D(w)}</div>`,opts:R.shuffle([w,...o]).map(x=>x[0]),ans:w[0],exp:`<b>${w[0]}</b> (${w[1]}): ${D(w)}`};
  return{q:`다음 단어의 영영 풀이로 알맞은 것은?<div class="data">${w[0]}</div>`,opts:R.shuffle([w,...o]).map(D),ans:D(w),exp:`<b>${w[0]}</b> (${w[1]}): ${D(w)}`}}});
 /* 중: 같은 품사 오답 / 빈칸 문장 → 풀이 / 연결이 틀린 것 */
 T.push({id:pre+'-ee2',u:code,name:'영영 풀이 (문장·연결)',lv:2,g:R=>{const k=R.i(0,2);
  if(k===0){const w=R.pick(L),o=EE_wr(R,L,w,4,true);return{q:`다음 영영 풀이에 해당하는 단어로 알맞은 것은? <span class="muted">(${P(w)})</span><div class="psg">${D(w)}</div>`,opts:R.shuffle([w,...o]).map(x=>x[0]),ans:w[0],exp:`<b>${w[0]}</b> (${w[1]}): ${D(w)}`+(o.every(x=>EE_D[x[0]][0]===EE_D[w[0]][0])?`<br>보기가 모두 ${P(w)}이므로 품사가 아니라 뜻으로 구별해야 한다.`:'')}}
  if(k===1){const S=L.filter(x=>x[2]);const w=R.pick(S),o=EE_wr(R,L,w,4,true);return{q:`다음 빈칸에 들어갈 단어의 영영 풀이로 알맞은 것은?${psg(EE_bl(w[2]))}`,opts:R.shuffle([w,...o]).map(D),ans:D(w),exp:`${EE_fill(w[2],w[0])}<br><b>${w[0]}</b> (${w[1]}): ${D(w)}`}}
  const pk=[R.pick(L)];pk.push(...EE_wr(R,L,pk[0],4));const bad=R.i(0,4),sw=EE_wr(R,L.filter(x=>!pk.includes(x)&&pk.every(y=>EE_ok(y[0],x[0]))),pk[bad],1)[0];
  const opt=pk.map((x,i)=>`${x[0]} : ${i===bad?D(sw):D(x)}`);
  return{q:'다음 중 단어와 영영 풀이가 바르게 연결되지 <u>않은</u> 것은?',opts:opt,ans:opt[bad],exp:`${opt[bad]}의 풀이는 <b>${sw[0]}</b>(${sw[1]})의 뜻이다.<br><b>${pk[bad][0]}</b> (${pk[bad][1]}): ${D(pk[bad])}`}}});
 /* 상: 바른 연결 개수 / (A)(B) 짝 / 풀이에 맞는 단어가 들어갈 문장 */
 T.push({id:pre+'-ee3',u:code,name:'영영 풀이 (심화)',lv:3,g:R=>{const k=R.i(0,2);
  if(k===0){const pk=[R.pick(L)];pk.push(...EE_wr(R,L,pk[0],4));const nb=R.i(1,4),badI=R.shuffle([0,1,2,3,4]).slice(0,nb);
   const used=[];const rows=pk.map((x,i)=>{if(!badI.includes(i))return[x,D(x),1];const sw=EE_wr(R,L.filter(y=>!pk.includes(y)&&!used.includes(y)&&pk.every(z=>EE_ok(z[0],y[0]))),x,1)[0];used.push(sw);return[x,D(sw),0,sw]});
   const n=rows.filter(r=>r[2]).length,lab='ⓐⓑⓒⓓⓔ';
   return{q:`다음 중 단어와 영영 풀이가 바르게 연결된 것의 개수는?<div class="psg">${rows.map((r,i)=>`${lab[i]} <b>${r[0][0]}</b> : ${r[1]}`).join('<br>')}</div>`,opts:['1개','2개','3개','4개','5개'],ans:n+'개',
    exp:`바른 것: ${rows.map((r,i)=>r[2]?lab[i]:'').join('')||'없음'} → ${n}개<br>${rows.filter(r=>!r[2]).map(r=>`${r[0][0]}(${r[0][1]}) ≠ 풀이는 ${r[3][0]}(${r[3][1]})의 뜻`).join('<br>')}`}}
  if(k===1){const a=R.pick(L),b=EE_wr(R,L,a,1)[0],o=EE_wr(R,L.filter(x=>x!==a&&x!==b),a,6).concat(EE_wr(R,L.filter(x=>x!==a&&x!==b),b,6));
   const ans=`${a[0]} – ${b[0]}`,wr=[`${b[0]} – ${a[0]}`];o.forEach((x,i)=>wr.push(i%2?`${a[0]} – ${x[0]}`:`${x[0]} – ${b[0]}`));
   return{q:`다음 (A), (B)의 영영 풀이에 해당하는 단어를 순서대로 바르게 짝지은 것은?<div class="psg">(A) ${D(a)}<br>(B) ${D(b)}</div>`,...mc(R,ans,wr),exp:`(A) <b>${a[0]}</b> (${a[1]})<br>(B) <b>${b[0]}</b> (${b[1]})`}}
  const S=L.filter(x=>x[2]);const w=R.pick(S),o=EE_wr(R,S,w,4);
  const opt=[w,...o].map(x=>EE_bl(x[2]));
  return{q:`다음 영영 풀이에 해당하는 단어가 들어가기에 가장 알맞은 문장은?<div class="psg">${D(w)}</div>`,opts:R.shuffle(opt.slice()),ans:opt[0],exp:`풀이의 단어는 <b>${w[0]}</b>(${w[1]}).<br>${EE_fill(w[2],w[0])}<br>${o.map(x=>`· ${x[0]}: ${EE_fill(x[2],x[0])}`).join('<br>')}`}}});
 /* 보기 5개·중복 없음·정답 포함될 때까지 재생성 */
 T.forEach(t=>{const f=t.g;t.g=R=>{for(let i=0;i<400;i++){try{const r=f(R);if(r&&r.opts.length===5&&new Set(r.opts).size===5&&r.opts.includes(r.ans))return r}catch(e){}}throw new Error('gen fail '+t.id)}});
 return T}
/* 각 학기 어휘 소단원 바로 뒤에 끼워 넣는다 */
function EE_add(S,code,list,pre){const T=EE_types(code,list,pre);const i=S.T.map(t=>t.u).lastIndexOf(code);S.T.splice(i<0?S.T.length:i+1,0,...T)}
[['E5V',V5,'e5'],['E6V',V6,'e6'],['E7V',V7,'e7'],['E8V',V8,'e8']].forEach(([c,l,p])=>EE_add(SUBJ.eng,c,l,p));
[['A1V',W1,'e21-1'],['A2V',W2,'e21-2'],['A3V',W3,'e21-3'],['A4V',W4,'e21-4'],['A5V',W5,'e21-5']].forEach(([c,l,p])=>EE_add(SEMS['2-1'].eng,c,l,p));
[['B5V',W5,'e22-5'],['B6V',E22_W6,'e22-6'],['B7V',E22_W7,'e22-7'],['B8V',E22_W8,'e22-8']].forEach(([c,l,p])=>EE_add(SEMS['2-2'].eng,c,l,p));

<script>

/* 동기화 훅: 웹앱(PWA) 버전에서 다른 기기 기록을 합쳐 보여 줄 때 덮어쓴다 */
let allS=()=>S,onRecord=()=>{},onSubject=()=>{},statsExtra=()=>'';
let CUR,UNITS,T,SUBS,SUBNAME,TYPE,S,sel;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let SEM=SEMS[LS.get('m12-sem','1-2')]?LS.get('m12-sem','1-2'):'1-2',SJ=SEMS[SEM];const SK=(c=CUR)=>SEM==='1-2'?c:c+'_'+SEM.replace('-','');
const $=s=>document.querySelector(s);
const LV=['','하','중','상'];
function gen(id,seed){for(let k=0;k<6;k++){try{const d=TYPE[id].g(mkR(seed+k*7919));if(d&&d.opts&&d.opts.length===5&&d.opts.includes(d.ans))return d}catch(e){}}
 return{q:'문제를 만들지 못했습니다. 다른 문제를 눌러 주세요.',opts:['-','-','-','-','-'],ans:'-',exp:''}}
function record(id,seed,ok){const t=S.t[id]||(S.t[id]=[0,0]);t[0]++;if(ok)t[1]++;
 S.w=S.w.filter(x=>!(x.id===id&&x.seed===seed));if(!ok){S.w.unshift({id,seed,at:Date.now()});S.w=S.w.slice(0,80)}LS.set('m12-rec-'+SK(),S);onRecord()}
function plain(h){return h.replace(/<math>[\s\S]*?<\/math>/g,m=>{const p=m.match(/<mrow>([\s\S]*?)<\/mrow><mrow>([\s\S]*?)<\/mrow>/);const s=x=>x.replace(/<[^>]+>/g,'');return p?`(${s(p[1])})/(${s(p[2])})`:s(m)})
 .replace(/<span class="sg">(.*?)<\/span>/g,'$1').replace(/<br\s*\/?>/g,'\n').replace(/<div class="psg">/g,'\n').replace(/<\/(div|p|tr)>/g,'\n').replace(/<\/t[dh]>/g,'\t').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\n{2,}/g,'\n').trim()}
function qHTML(it,idx,o){const t=TYPE[it.id],d=it.d,ai=d.opts.indexOf(d.ans),done=o.graded;
 const short=d.opts.every(x=>x.length<=14);
 const opts=d.opts.map((x,j)=>{let c='',mk='';if(done){if(j===ai){c='ok';mk='정답'}if(it.pick===j&&j!==ai){c='no';mk='내 답'}}else if(it.pick===j)c='on';
  return `<li><button class="opt ${c}" data-q="${idx}" data-j="${j}" ${done&&o.lock?'disabled':''}><span class="bub">${j+1}</span><span>${x}</span>${mk?`<span class="mk">${mk}</span>`:''}</button></li>`}).join('');
 const exp=`<div class="exp"><b class="h">정답 ${CIRC[ai]} · 풀이</b>${d.exp}</div>`;
 return `<article class="q" id="q${idx}" data-aik="${CUR}|${hsh(d.q)}" data-ans="${ai+1}" data-pick="${it.pick??-1}" data-done="${done?1:0}"><template class="aix">${d.exp}</template><div class="qh"><span class="qn">${o.num??idx+1}</span><span class="tag">${SUBNAME[t.u]} · ${t.name}${it.src?` · <b class="src">${it.src}</b>`:''}</span><span class="lv lv${t.lv}">${LV[t.lv]}</span></div>
 <div class="qt">${d.q}</div>${d.fig?`<figure class="fig">${d.fig}</figure>`:''}<ol class="opts${short?' short':''}">${opts}</ol>
 ${done?(o.fold?`<details class="ex" ${it.pick!==ai?'open':''}><summary>풀이 보기</summary>${exp}</details>`:exp):''}<div class="aibar"><button class="aibtn" data-ai="q">AI 선생님에게 묻기</button></div></article>`}
const scoped=()=>T.filter(t=>sel.has(t.u));
const qCount=t=>t.bank?t.n:'∞';

/* ===== 과목 전환 ===== */
function setSubject(id){CUR=id;OV=null;document.documentElement.dataset.s=id;const s=SJ[id];UNITS=s.units;T=s.T;SUBS=UNITS.flatMap(u=>u.subs.map(x=>x[0]));SUBNAME=Object.fromEntries(UNITS.flatMap(u=>u.subs));TYPE=Object.fromEntries(T.map(t=>[t.id,t]));
 S=LS.get('m12-rec-'+SK(id),null)||(id==='math'&&SEM==='1-2'?LS.get('m12-rec',{t:{},w:[]}):{t:{},w:[]});
 sel=new Set(LS.get('m12-sel-'+SK(id),null)||(id==='math'&&SEM==='1-2'?LS.get('m12-sel',null):null)||s.def||SUBS);
 LS.set('m12-subj',id);
 $('#subj').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sub===id));
 $('#hinfo').textContent=`${s.book} · ${T.length}개 유형`;
 $('#presets').innerHTML='<span>빠른 선택</span>'+s.presets.map((p,i)=>`<button class="chip" data-pre="${i}">${p[0]}</button>`).join('')+'<button class="chip" data-pre="none">전체 해제</button><p class="muted" style="margin:6px 0 0;width:100%;font-size:12.5px">단원 이름을 누르면 그 단원 전체가 선택·해제되고, 소단원은 하나씩 눌러 고를 수 있습니다.</p>';
 P.n=0;P.ok=0;P.last=null;renderScope();newPractice();E=null;makeExam(2612,examN,null,null,{save:false});
 const tab=LS.get('m12-tab','practice');if(tab==='review')renderReview();if(tab==='stats')renderStats();onSubject(id)}
function renderSem(){const [g,t,ey]=SEMNAME[SEM];$('#eyebrow').textContent=ey;$('#htitle').textContent=`${g} ${t} 문제은행`;
 $('#sems').innerHTML=Object.keys(SEMS).filter(k=>Object.keys(SEMS[k]).length).map(k=>`<button data-sem="${k}" aria-pressed="${k===SEM}">${SEMNAME[k][0]} ${SEMNAME[k][1]}</button>`).join('');
 $('#subj').innerHTML=ORDER.filter(k=>SJ[k]).map(k=>`<button data-sub="${k}" aria-pressed="false">${SJ[k].name}</button>`).join('')}
renderSem();
$('#sems').addEventListener('click',e=>{const b=e.target.closest('[data-sem]');if(!b||b.dataset.sem===SEM)return;SEM=b.dataset.sem;SJ=SEMS[SEM];LS.set('m12-sem',SEM);renderSem();setSubject(SJ[CUR]?CUR:ORDER.find(k=>SJ[k]))});
$('#subj').addEventListener('click',e=>{const b=e.target.closest('[data-sub]');if(b&&b.dataset.sub!==CUR)setSubject(b.dataset.sub)});

/* ===== 범위 ===== */
function renderScope(){$('#units').innerHTML=UNITS.map(U=>{const n=U.subs.filter(x=>sel.has(x[0])).length,st=n===U.subs.length?'all':n?'part':'none';return `<div class="unit"><button class="uh" data-u="${U.id}" data-st="${st}" aria-pressed="${st==='all'}" title="${st==='all'?'단원 전체 해제':'단원 전체 선택'}"><span class="ck">${st==='all'?'✓':st==='part'?'–':''}</span><span class="rn">${U.tag}</span>${U.name}</button><div class="subs">${U.subs.map(([id,nm])=>`<button class="chip ${sel.has(id)?'on':''}" data-s="${id}" aria-pressed="${sel.has(id)}">${nm}<small>${T.filter(t=>t.u===id).length}</small></button>`).join('')}</div></div>`}).join('');
 $('#scopeSum').textContent=`소단원 ${sel.size}/${SUBS.length} · ${scoped().length}개 유형`;LS.set('m12-sel-'+SK(),[...sel])}
$('#scope').addEventListener('click',e=>{const s=e.target.closest('button[data-s]'),u=e.target.closest('[data-u]'),p=e.target.closest('[data-pre]');
 if(s){sel.has(s.dataset.s)?sel.delete(s.dataset.s):sel.add(s.dataset.s)}
 else if(u){const subs=UNITS.find(x=>x.id===u.dataset.u).subs.map(x=>x[0]);const all=subs.every(x=>sel.has(x));subs.forEach(x=>all?sel.delete(x):sel.add(x))}
 else if(p){if(p.dataset.pre==='none')sel=new Set();else{const pr=SJ[CUR].presets[+p.dataset.pre][1];sel=new Set(pr||SUBS)}}
 else return;e.preventDefault();renderScope();if(!P.it||!sel.has(TYPE[P.it.id].u))newPractice()});

/* ===== 연습 ===== */
const P={it:null,lv:0,n:0,ok:0,last:null};
function newPractice(id,seed){let pool=scoped().filter(t=>!P.lv||t.lv===P.lv).map(t=>t.id);
 if(!id&&!pool.length){P.it=null;renderPractice();return}
 if(!id){if(pool.length>1)pool=pool.filter(x=>x!==P.last);id=pool[Math.floor(Math.random()*pool.length)]}
 let d,sd;if(seed!=null){sd=seed;d=gen(id,sd)}else{const prevQ=P.it&&P.it.id===id?P.it.d.q:null;for(let k=0;k<8;k++){sd=Math.floor(Math.random()*1e9);d=gen(id,sd);if(d.q!==prevQ)break}}
 P.last=id;P.it={id,seed:sd,d,pick:null};renderPractice()}
function renderPractice(){const v=$('#v-practice');
 const lvBar=`<div class="bar"><span class="muted">난이도</span>${[0,1,2,3].map(l=>`<button class="chip ${P.lv===l?'on':''}" data-lv="${l}">${l?LV[l]:'전체'}</button>`).join('')}<span class="sp"></span><span class="tally">이번에 ${P.n}문제 · 정답 ${P.ok}</span></div>`;
 if(!P.it){v.innerHTML=lvBar+`<div class="empty" style="margin-top:12px">선택한 범위와 난이도에 맞는 유형이 없습니다. 위에서 출제 범위를 넓혀 주세요.</div>`;return}
 const done=P.it.pick!=null,bk=TYPE[P.it.id].bank;
 v.innerHTML=lvBar+`<div class="sheet" style="margin-top:12px">${qHTML(P.it,0,{graded:done,lock:true,num:P.n+(done?0:1)})}</div>
 <div class="bar" style="margin-top:12px"><button class="btn pri" data-act="next">다음 문제</button><button class="btn" data-act="again">${bk?'같은 유형 다른 문제':'같은 유형, 숫자만 바꿔서'}</button></div>`}
$('#v-practice').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.lv!=null){P.lv=+b.dataset.lv;newPractice();return}
 if(b.dataset.act==='next'){newPractice();return}
 if(b.dataset.act==='again'&&P.it){newPractice(P.it.id);return}
 if(b.dataset.j!=null&&P.it&&P.it.pick==null){P.it.pick=+b.dataset.j;const ok=P.it.d.opts[P.it.pick]===P.it.d.ans;P.n++;if(ok)P.ok++;record(P.it.id,P.it.seed,ok);renderPractice()}});

/* ===== 모의고사 ===== */
let E=null,examN=LS.get('m12-n',20);
function pickTypes(R,count,types){const by={};types.forEach(t=>(by[t.u]=by[t.u]||[]).push(t));const keys=SUBS.filter(k=>by[k]);keys.forEach(k=>by[k]=R.shuffle(by[k]));
 const ptr={};const out=[];let ks=R.shuffle(keys);while(out.length<count){for(const k of ks){if(out.length>=count)break;const i=ptr[k]||0;out.push(by[k][i%by[k].length]);ptr[k]=i+1}ks=R.shuffle(keys)}
 return out.sort((a,b)=>SUBS.indexOf(a.u)-SUBS.indexOf(b.u)||a.lv-b.lv)}
function makeExam(seed,count,list,label,o){o=o||{};let ids;if(list){ids=list}else{const types=scoped();if(!types.length){E={err:true};renderExam();return}ids=pickTypes(mkR(seed),count,types).map(t=>t.id)}
 const seen=new Set();const items=ids.map((id,i)=>{let s=seed*100+i,d=gen(id,s);for(let k=1;k<10&&seen.has(d.q);k++){s=seed*100+i+k*1000003;d=gen(id,s)}seen.add(d.q);return{id,seed:s,d,pick:null}});
 if(o.srcs)items.forEach((it,i)=>it.src=o.srcs[i]);

 if(o.save!==false){const H=LS.get('m12-hist-'+SK(),[]);E.hk=Date.now();H.unshift({k:E.hk,seed,label:E.label,ids:items.map(i=>i.id),srcs:o.srcs||null,at:E.hk,score:null});LS.set('m12-hist-'+SK(),H.slice(0,30))}
 renderExam()}
function renderExam(){const v=$('#v-exam');
 const cfg=`<div class="cfg"><div class="bar"><span class="muted">문항 수</span>${[10,15,20,25].map(n=>`<button class="chip ${examN===n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>
 <div class="bar"><label for="seedIn">시험지 번호 <input id="seedIn" inputmode="numeric" placeholder="자동"></label><span class="sp"></span><button class="btn pri" data-act="make">시험지 만들기</button></div>
 <p class="muted" style="margin:0">같은 과목에서 같은 번호를 넣으면 같은 시험지가 다시 나옵니다.</p></div>`;

    const opts=[...art.querySelectorAll('.opt')].map((b,j)=>`${CIRC[j]} ${aiTxt(b.children[1])}`).join('\n');
    const ans=+art.dataset.ans,pick=+art.dataset.pick,done=art.dataset.done==='1';
    const tp=document.createElement('div');tp.innerHTML=art.querySelector('template.aix')?.innerHTML||'';
    const state=!done?(pick>=0?`학생이 ${CIRC[pick]}를 골랐고 아직 채점 전`:'아직 풀지 않음'):(pick===ans-1?`학생이 ${CIRC[pick]}를 골라 맞힘`:pick>=0?`학생이 ${CIRC[pick]}를 골랐고 틀림`:'답을 고르지 않은 채 채점됨');
    const imgs=[];const svg=art.querySelector('.fig svg');if(svg&&AI_IMG){const b=await aiSvgBlob(svg);if(b)imgs.push(b)}
    return{imgs,txt:`과목: ${sj.name} (${sj.book})\n단원·유형: ${aiTxt(art.querySelector('.tag'))}\n\n[문제]\n${aiTxt(art.querySelector('.qt'))}${svg?`\n(그림이 있는 문제${imgs.length?' — 그림을 이미지로 함께 보냄':''})`:''}\n\n[보기]\n${opts}\n\n[정답·풀이]\n정답 ${CIRC[ans-1]}\n${aiTxt(tp)}\n\n[학생 상태]\n${state}`}}
  /* 원본 시험지 */
  const o=OV&&OV.o;if(!o)return{txt:'',imgs:[]};const num=(st.num||'').trim();const imgs=[];
  if(o.pages&&AI_IMG&&st.page){try{const r=await fetch(`jokbo/${o.key}/p-${st.page}.jpg`);if(r.ok)imgs.push(await r.blob())}catch(e){}}
  let ak='';if(num){const i=OV.its.findIndex(it=>String(it.l)===num);if(i>=0){const it=OV.its[i];ak=it.a?`정답 ${it.a.map(n=>CIRC[n-1]).join(', ')}`:`모범 답안: ${it.s}`;
    const p=OV.pick[i]||[];var stt=!OV.graded?(p.length?`학생이 ${p.map(n=>CIRC[n-1]).join(', ')}에 표시했고 아직 채점 전`:'아직 풀지 않음'):(it.a?(oOk(it,p)?'맞힘':`학생이 ${p.length?p.map(n=>CIRC[n-1]).join(', '):'무표기'}로 틀림`):'서술형 — 학생이 스스로 채점')}}
  return{imgs,txt:`과목: ${sj.name}\n시험지: ${o.title} (${o.meta})\n${imgs.length?`[이미지] 이 시험지 ${st.page}쪽 사진을 함께 보냄. 사진 속에서 해당 번호 문제를 찾아 읽어요.`:'[이미지 없음] 학생이 문제 내용을 직접 적었을 수 있어요.'}\n문제 번호: ${num||'(지정 안 함)'}\n\n[정답·풀이]\n${ak||'(답안표에서 찾지 못함)'}\n\n[학생 상태]\n${stt||'알 수 없음'}`}}
function aiQuick(st){if(st.kind==='o')return['이 문제 힌트 주세요','풀이를 단계별로 알려 주세요','관련 개념을 정리해 주세요','비슷한 문제 하나 내 주세요'];
  const art=document.querySelector(`article[data-aik="${st.key}"]`);const done=art&&art.dataset.done==='1',wrong=done&&+art.dataset.pick!==+art.dataset.ans-1;
  return done?['왜 이게 정답인가요?',...(wrong?['제 답은 왜 틀렸나요?']:[]),'더 쉽게 설명해 주세요','비슷한 문제 하나 내 주세요']:['힌트 주세요','관련 개념을 설명해 주세요','어떤 순서로 풀면 돼요?']}
function aiBoxHTML(st){const o=st.kind==='o'&&OV?OV.o:null;
  return `<div class="aibox" data-aib="${st.key}">
  <div class="aihd"><b>AI 선생님</b><span class="muted">질문할 때마다 Claude 사용량이 조금 쓰여요</span><button class="aiclose" data-aic="1" aria-label="닫기">닫기</button></div>
  ${o?`<div class="aiopt">${o.pages?`<label for="aip-${hsh(st.key)}">쪽</label><select id="aip-${hsh(st.key)}" data-aipg="1">${Array.from({length:o.pages},(_,i)=>`<option value="${i+1}" ${+st.page===i+1?'selected':''}>${i+1}쪽</option>`).join('')}</select>`:''}<label for="ain-${hsh(st.key)}">문제 번호</label><input id="ain-${hsh(st.key)}" data-ainum="1" value="${aiEsc(st.num||'')}" placeholder="예: 7" inputmode="text"></div>
  ${!o.pages||!AI_IMG?'<p class="ainote">이 시험지는 사진을 보낼 수 없어요. 질문에 문제 내용을 함께 적어 주세요.</p>':''}`:''}
  <div class="ailog">${st.qa.map(m=>`<div class="aimsg me">${aiEsc(m.q)}</div>${m.a!=null?`<div class="aimsg t">${aiFmt(m.a)}</div>`:''}${m.err?`<p class="ainote">${aiEsc(m.err)}</p>`:''}`).join('')}${st.busy&&!(st.qa.at(-1)||{}).a?'<div class="aimsg t think">생각하는 중…</div>':''}</div>
  <div class="aiq">${aiQuick(st).map(q=>`<button class="chip" data-aiq="${aiEsc(q)}" ${st.busy?'disabled':''}>${q}</button>`).join('')}</div>
  <div class="aiin"><input id="ait-${hsh(st.key)}" data-aitxt="1" placeholder="궁금한 점을 적어 보세요" autocomplete="off" ${st.busy?'disabled':''}>${st.busy?'<button class="btn sm" data-aix="1">멈추기</button>':'<button class="btn pri sm" data-ais="1">보내기</button>'}</div></div>`}
function aiAnchor(key){return document.querySelector(`[data-aik="${CSS.escape(key)}"]`)}
function aiRender(key){const st=AIS.get(key),an=aiAnchor(key);if(!an)return;let box=document.querySelector(`[data-aib="${CSS.escape(key)}"]`);
  if(!st||!st.open){if(box)box.remove();return}
  const html=aiBoxHTML(st);if(box){const typed=box.querySelector('[data-aitxt]')?.value||'';box.outerHTML=html;box=document.querySelector(`[data-aib="${CSS.escape(key)}"]`);if(!st.busy&&typed)box.querySelector('[data-aitxt]').value=typed}
  else{an.tagName==='ARTICLE'?an.insertAdjacentHTML('beforeend',html):an.insertAdjacentHTML('afterend',html)}
  const lg=document.querySelector(`[data-aib="${CSS.escape(key)}"] .ailog`);if(lg)lg.scrollTop=lg.scrollHeight}
const AI_ERR={rate_limited:'질문이 너무 많아요. 잠시 뒤에 다시 물어보세요.',session_expired:'claude.ai에 다시 로그인한 뒤 물어보세요.',refused:'이 질문에는 답할 수 없어요. 질문을 바꿔 보세요.',empty_completion:'답이 비어 있어요. 질문을 조금 바꿔 보세요.',image_rejected:'사진을 보낼 수 없어요. 문제 내용을 글로 적어 주세요.',prompt_too_large:'대화가 너무 길어요. 닫았다가 다시 열어 새로 물어보세요.'};
async function aiAsk(key,q){const st=AIS.get(key);if(!st||st.busy||!SAMPLE||!q.trim())return;
  st.qa.push({q:q.trim(),a:null});st.busy=true;st.ctl=new AbortController();aiRender(key);
  const cur=st.qa.at(-1);
  try{const ctx=await aiCtx(key);const hist=st.qa.slice(-6),turns=[];
    hist.forEach((m,i)=>{turns.push({role:'user',content:i===0?`${AI_RULES}\n\n${ctx.txt}\n\n[학생 질문]\n${m.q}`:m.q});if(m!==cur&&m.a)turns.push({role:'assistant',content:m.a})});
    if(hist.length>1)turns[turns.length-1]={role:'user',content:`(지금 문제 상태)\n${ctx.txt}\n\n[학생 질문]\n${cur.q}`};
    const opt={signal:st.ctl.signal,cache:false,onText:({text})=>{cur.a=text;const el=document.querySelector(`[data-aib="${CSS.escape(key)}"] .ailog .aimsg.t:last-child, [data-aib="${CSS.escape(key)}"] .ailog .think`);if(el&&el.classList.contains('think')){aiRender(key)}else if(el){el.innerHTML=aiFmt(text);const lg=el.parentElement;lg.scrollTop=lg.scrollHeight}}};
    if(ctx.imgs.length)opt.images=ctx.imgs;
    const r=await SAMPLE(turns,opt);cur.a=r.text;if(r.truncated)cur.err='답이 길어서 중간에 끊겼어요. 더 짧게 물어보세요.'}
  catch(e){const c=e&&e.code;if(c==='refused')cur.a=null;else cur.a=e&&e.text?e.text:null;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){cur.err='이 화면에서는 AI 선생님을 쓸 수 없어요. (Claude 사용을 허용하지 않았거나 계정에서 꺼져 있어요)'}
    else if(c==='images_unavailable'){AI_IMG=false;cur.err='사진은 보낼 수 없어요. 다시 보내 주세요.'}
    else if(c!=='cancelled')cur.err=AI_ERR[c]||'연결이 끊겼어요. 다시 보내 보세요.';
    if(c==='cancelled'&&!cur.a)cur.err='멈췄어요.'}
  finally{st.busy=false;st.ctl=null;aiRender(key)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ai],[data-aic],[data-aiq],[data-ais],[data-aix]');if(!b)return;e.stopPropagation();e.preventDefault();
  if(b.dataset.ai){const an=b.closest('[data-aik]');if(!an)return;const key=an.dataset.aik;let st=AIS.get(key);
    if(!st){st={key,kind:b.dataset.ai,qa:[],open:false,busy:false,page:1,num:''};AIS.set(key,st)}st.open=!st.open;aiRender(key);
    if(st.open)document.querySelector(`[data-aib="${CSS.escape(key)}"] [data-aitxt]`)?.focus({preventScroll:true});return}
  const box=b.closest('[data-aib]');if(!box)return;const key=box.dataset.aib,st=AIS.get(key);if(!st)return;
  if(b.dataset.aic){st.ctl?.abort();st.open=false;aiRender(key);return}
  if(b.dataset.aix){st.ctl?.abort();return}
  if(b.dataset.aiq){aiAsk(key,b.dataset.aiq);return}
  if(b.dataset.ais){const inp=box.querySelector('[data-aitxt]');const v=inp.value;inp.value='';aiAsk(key,v)}},true);
document.addEventListener('keydown',e=>{const t=e.target;if(!t.dataset||!t.dataset.aitxt||e.key!=='Enter'||e.isComposing)return;e.preventDefault();const box=t.closest('[data-aib]');const v=t.value;t.value='';aiAsk(box.dataset.aib,v)},true);
document.addEventListener('input',e=>{const t=e.target;const box=t.closest&&t.closest('[data-aib]');if(!box)return;const st=AIS.get(box.dataset.aib);if(!st)return;
  if(t.dataset.ainum)st.num=t.value;if(t.dataset.aipg)st.page=+t.value},true);
document.addEventListener('change',e=>{const t=e.target;const box=t.closest&&t.closest('[data-aib]');if(!box)return;const st=AIS.get(box.dataset.aib);if(st&&t.dataset.aipg)st.page=+t.value},true);
/* 화면이 다시 그려져도 열어 둔 대화를 다시 붙임 */
new MutationObserver(()=>{for(const [k,st] of AIS){if(st.open&&aiAnchor(k)&&!document.querySelector(`[data-aib="${CSS.escape(k)}"]`))aiRender(k)}}).observe(document.querySelector('.wrap'),{childList:true,subtree:true});

<script>

const FB_COL='exam_bank';

 const addS=(x)=>{if(!x)return;for(const id in x.t||{}){const a=t[id]||(t[id]=[0,0]);a[0]+=x.t[id][0];a[1]+=x.t[id][1]}(x.w||[]).forEach(e=>w.push(e))};

async function pull(subj){if(!fdb)return;try{const doc=await fdb.collection(FB_COL).doc('rec_'+subj).get();const data=doc.exists?doc.data():{};const r={};
 for(const k in data){if(!k.startsWith('d_')||k==='d_'+DEV)continue;try{r[k.slice(2)]=JSON.parse(data[k])}catch(e){}}

 <div class="row"><div class="t"><b>이 기기 (${devName().replace(/</g,'&lt;')})</b><p>이름 칸에 아이 이름을 적어 두면 구분하기 쉽습니다.</p></div><div class="num">${mine}문제</div></div>${others}</div>`};
