  `직선 AB = 직선 BA, 선분 AB = 선분 BA, 반직선 AB ${F('≠')} 반직선 BA (시작점과 방향이 다름)`,`선분 AB의 중점 M: ${F('AM = MB = '+fr(1,2)+'AB')}`,
  `맞꼭지각의 크기는 ${F('서로 같다')} / 평각 = ${F('180°')}, 직각 = ${F('90°')}`,`점과 직선 사이의 거리 = 점에서 직선에 내린 ${F('수선의 발까지의 거리')} (가장 짧은 거리)`],
 tbl:{h:['n개의 점 (어느 세 점도 한 직선 위에 있지 않음)','개수'],r:[['직선',fr('n(n − 1)',2)],['선분',fr('n(n − 1)',2)],['반직선','n(n − 1)']]},
 warn:['한 직선 위에 있는 점들로는 직선이 <b>1개</b>뿐이다. 이때는 공식을 쓰지 말고 직접 센다.','반직선은 시작점과 방향이 모두 같아야 같은 반직선이다.','예각 0° < x < 90°, 둔각 90° < x < 180°. 0°, 90°, 180°는 예각·둔각이 아니다.','점과 직선 사이의 거리는 비스듬한 선분이 아니라 수선의 길이다.'],
 ex:[{t:'어느 세 점도 한 직선 위에 있지 않은 네 점 A, B, C, D로 만들 수 있는 직선·반직선·선분의 개수',a:`직선 ${fr('4 × 3',2)} = 6, 선분 6, 반직선 4 × 3 = 12<br>∴ <b>직선 6개, 반직선 12개, 선분 6개</b>`},
  {t:'선분 AB의 중점을 M, 선분 MB의 중점을 N이라 하자. AB = 20 cm일 때 AN의 길이',a:'AM = MB = 10, MN = 5<br>AN = AM + MN = <b>15 cm</b>'},
  {t:'평각을 세 각 x, 2x, 3x로 나눌 때 x',a:'x + 2x + 3x = 180° → 6x = 180° → <b>x = 30°</b>'}],
 go:['a1-mid','a1-vert','a1-flat','a1-pv','a1-line','a1-dist']},
{id:'N-A2',u:'A2',title:'위치 관계와 평행선의 성질',
 pts:[`평면에서 두 직선: 한 점에서 만난다 / 평행하다 / ${F('일치한다')}`,`공간에서 두 직선: 한 점에서 만난다 / 평행하다 / ${F('꼬인 위치에 있다')} / 일치한다`,
  `꼬인 위치: ${F('만나지도 않고 평행하지도 않은')} 두 직선 (공간에서만)`,`공간에서 직선과 평면: ${F('포함된다 / 한 점에서 만난다 / 평행하다')}`,
  `l ∥ m이면 ${F('동위각의 크기가 같고, 엇각의 크기가 같다')}`,`거꾸로 동위각 또는 엇각의 크기가 같으면 ${F('두 직선은 평행')} / 같은 쪽 내각의 합이 ${F('180°')}이면 평행`],
 tbl:{h:['평행선 문제 유형','푸는 방법'],r:[['꺾인 선 (한 번)','꺾인 점을 지나고 l, m에 평행한 직선을 긋고 엇각 이용 → 꺾인 각 = 두 각의 합'],['꺾인 선 (여러 번)','왼쪽으로 꺾인 각들의 합 = 오른쪽으로 꺾인 각들의 합'],['종이 띠 접기','접은 각의 크기가 같음 + 엇각 → 이등변삼각형이 생김'],['평행 판정','동위각·엇각이 같은지, 같은 쪽 내각의 합이 180°인지 확인']]},
 warn:['꼬인 위치는 공간에서만 생긴다. 평면 위의 두 직선은 꼬인 위치에 있을 수 없다.','직육면체에서 한 모서리와 꼬인 위치의 모서리 찾기: 그 모서리와 만나는 것, 평행한 것을 지우고 남은 것.','동위각·엇각은 평행하지 않아도 있다. 크기가 같은 것은 평행할 때만.','맞꼭지각이 같다는 것은 평행과 관계없다.'],
 ex:[{t:'직육면체에서 모서리 AB와 꼬인 위치에 있는 모서리의 개수',a:'모서리 12개 − AB 자신 1개 − 만나는 모서리 4개 − 평행한 모서리 3개 = <b>4개</b>'},
  {t:'l ∥ m이고, 두 직선 사이에서 꺾인 선이 l과 40°, m과 35°를 이룰 때 꺾인 각 x',a:'꺾인 점을 지나는 평행선을 그으면 엇각이 40°, 35°<br>∴ <b>x = 75°</b>'}],
 go:['a2-par','a2-pjudge','a2-skew','a2-bend','a2-zig','a2-fold']},
{id:'N-A3',u:'A3',title:'삼각형의 작도와 합동',
 pts:[`작도 도구: ${F('눈금 없는 자')}(선 긋기·연장)와 ${F('컴퍼스')}(원 그리기·길이 옮기기)`,`삼각형이 될 조건: ${F('(가장 긴 변) < (나머지 두 변의 합)')}`,
  `두 변 a, b가 주어질 때 나머지 한 변 x의 범위: ${F('|a − b| < x < a + b')}`,`합동 조건: ${F('SSS (세 변) / SAS (두 변과 끼인각) / ASA (한 변과 양 끝 각)')}`,`△ABC ≡ △DEF: ${F('대응하는 꼭짓점 순서대로')} 쓴다`],
 tbl:{h:['주어진 조건','삼각형이 하나로 정해질까?'],r:[['세 변의 길이 (가장 긴 변 < 나머지 합)','○'],['두 변의 길이와 그 끼인각','○'],['한 변의 길이와 그 양 끝 각','○'],['한 변과 두 각 (양 끝 각이 아니어도)','○ 나머지 한 각을 구하면 ASA'],['두 변과 끼인각이 아닌 각','× (0개, 1개 또는 2개)'],['세 각의 크기','× (모양은 같고 크기가 다른 것이 무수히 많음)'],['한 변과 양 끝 각의 합이 180° 이상','× (삼각형이 안 됨)']]},
 warn:['가장 긴 변 = 나머지 두 변의 합이면 삼각형이 <b>안 된다</b>. (등호 없음)','SAS의 각은 반드시 두 변 사이의 <b>끼인각</b>이어야 한다.','세 각이 같으면(AAA) 모양만 같다. 합동 조건이 아니다.','넓이나 둘레가 같다고 합동은 아니다.','작도에서 길이는 자로 재지 않는다. 길이를 옮길 때는 항상 컴퍼스를 쓴다.'],
 ex:[{t:'두 변의 길이가 4 cm, 9 cm인 삼각형에서 나머지 한 변의 길이가 자연수일 때 가능한 개수',a:'9 − 4 < x < 9 + 4 → 5 < x < 13 → 6, 7, …, 12 → <b>7개</b>'},
  {t:'길이가 3, 5, 7, 9 cm인 막대 중 3개로 만들 수 있는 삼각형의 개수',a:'(3, 5, 7) ○, (3, 5, 9) × (9 ≥ 8), (3, 7, 9) ○, (5, 7, 9) ○ → <b>3개</b>'}],
 go:['a3-cons','a3-tri','a3-side','a3-det','a3-cong']},
{id:'N-B1',u:'B1',title:'다각형의 대각선·내각·외각',
 pts:[`n각형의 한 꼭짓점에서 그은 대각선: ${F('(n − 3)개')}, 이때 생기는 삼각형: ${F('(n − 2)개')}`,`n각형의 대각선의 총 개수: ${F(fr('n(n − 3)',2))}`,
  `n각형의 내각의 크기의 합: ${F('180° × (n − 2)')} / 외각의 크기의 합: ${F('항상 360°')}`,`정n각형의 한 내각: ${F(fr('180° × (n − 2)','n'))}, 한 외각: ${F(fr('360°','n'))}`,
  `(한 내각) + (한 외각) = ${F('180°')}`,`삼각형의 한 외각 = ${F('이웃하지 않는 두 내각의 합')}`],
 tbl:{h:['다각형','대각선 수','내각의 합','정다각형 한 내각','한 외각'],r:[['삼각형','0','180°','60°','120°'],['사각형','2','360°','90°','90°'],['오각형','5','540°','108°','72°'],['육각형','9','720°','120°','60°'],['팔각형','20','1080°','135°','45°'],['십각형','35','1440°','144°','36°'],['십이각형','54','1800°','150°','30°']]},
 warn:['외각의 합은 몇 각형이든 360°. 내각의 합과 헷갈리지 않기.','한 내각 : 한 외각 = p : q → 한 외각 = 180° × '+fr('q','p + q')+' → n = 360° ÷ (한 외각)',`정다각형이 아니면 한 내각을 ${fr('180°(n − 2)','n')}로 구할 수 없다.`,'별 모양(오각별)의 다섯 꼭짓점의 각의 합 = 180°.','맞꼭지각을 낀 두 삼각형(나비 모양): 마주 보는 두 각의 합이 같다.'],
 ex:[{t:'대각선의 총 개수가 27개인 다각형의 내각의 크기의 합',a:`${fr('n(n − 3)',2)} = 27 → n(n − 3) = 54 = 9 × 6 → n = 9<br>180° × 7 = <b>1260°</b>`},
  {t:'한 내각과 한 외각의 크기의 비가 3 : 1인 정다각형',a:`한 외각 = 180° × ${fr(1,4)} = 45° → n = 360° ÷ 45° = 8 → <b>정팔각형</b>`},
  {t:'△ABC에서 ∠A = 50°, ∠B = 65°일 때 ∠C의 외각 x',fig:()=>figTri('50°','65°','x'),a:'x = ∠A + ∠B = 50° + 65° = <b>115°</b>'}],
 go:['b1-diag','b1-diag2','b1-tri','b1-miss','b1-ext','b1-reg','b1-ratio','b1-star','b1-bow']},
{id:'N-B2',u:'B2',title:'원과 부채꼴',
 pts:[`호: 원 위의 두 점 사이 원의 일부 / 현: ${F('원 위의 두 점을 이은 선분')} (가장 긴 현은 지름)`,`부채꼴: 두 반지름과 호로 이루어진 도형 / 활꼴: 현과 호로 이루어진 도형 → ${F('반원')}은 부채꼴이면서 활꼴`,
  `한 원에서 중심각의 크기에 ${F('호의 길이, 부채꼴의 넓이')}는 정비례한다`,`${F('현의 길이')}는 중심각의 크기에 정비례하지 않는다`],
 tbl:{h:['','원 (반지름 r)','부채꼴 (반지름 r, 중심각 x°)'],r:[['길이','둘레 2πr',`호 l = 2πr × ${fr('x',360)}`],['넓이','πr²',`S = πr² × ${fr('x',360)} = ${fr(1,2)}rl`],['둘레','2πr','l + 2r']]},
 warn:['부채꼴의 둘레는 호의 길이 + <b>반지름 2개</b>.',`호의 길이를 알면 넓이는 ${fr(1,2)}rl로 바로 구한다 (중심각 몰라도 됨).`,'중심각이 2배 → 호·넓이 2배. 반지름이 2배 → 호 2배, 넓이 4배.','색칠한 부분의 넓이: (큰 도형) − (작은 도형) 또는 잘라서 옮겨 붙여 간단한 모양으로.','현의 길이, 삼각형의 넓이는 중심각에 정비례하지 않는다 (옳지 않은 것 고르기 단골).'],
 ex:[{t:'반지름 6 cm, 중심각 120°인 부채꼴의 호의 길이·넓이·둘레',fig:()=>figSector(120,'6cm','120°'),a:`(호) = 2π × 6 × ${fr(120,360)} = <b>4π cm</b><br>(넓이) = π × 6² × ${fr(120,360)} = <b>12π cm²</b><br>(둘레) = <b>(4π + 12) cm</b>`},
  {t:'반지름 8 cm, 호의 길이 6π cm인 부채꼴의 넓이',a:`${fr(1,2)} × 8 × 6π = <b>24π cm²</b>`}],
 go:['b2-arc','b2-area','b2-rl','b2-peri','b2-circ','b2-prop','b2-con','b2-shade']},
{id:'N-C1',u:'C1',title:'다면체와 회전체',
 pts:[`다면체: ${F('다각형인 면')}으로만 둘러싸인 입체 → 면이 n개면 n면체`,`n각기둥: 면 ${F('n + 2')}, 모서리 ${F('3n')}, 꼭짓점 ${F('2n')}`,`n각뿔: 면 ${F('n + 1')}, 모서리 ${F('2n')}, 꼭짓점 ${F('n + 1')}`,`n각뿔대: 면 ${F('n + 2')}, 모서리 ${F('3n')}, 꼭짓점 ${F('2n')} (옆면은 사다리꼴)`,
  `정다면체 조건: ${F('모든 면이 합동인 정다각형')} + ${F('각 꼭짓점에 모인 면의 개수가 같다')} → 5가지뿐`,
  `회전체를 회전축에 수직인 평면으로 자른 단면: ${F('항상 원')} / 회전축을 포함하는 평면으로 자른 단면: ${F('선대칭도형')} (원기둥 → 직사각형, 원뿔 → 이등변삼각형, 원뿔대 → 사다리꼴, 구 → 원)`],
 tbl:{h:['정다면체','면 모양','한 꼭짓점의 면','면','모서리','꼭짓점'],r:[['정사면체','정삼각형','3','4','6','4'],['정육면체','정사각형','3','6','12','8'],['정팔면체','정삼각형','4','8','12','6'],['정십이면체','정오각형','3','12','30','20'],['정이십면체','정삼각형','5','20','30','12']]},
 warn:['원기둥·원뿔·구처럼 곡면이 있으면 다면체가 아니다.','각뿔대의 두 밑면은 평행하지만 합동이 아니다. 옆면은 직사각형이 아니라 사다리꼴.','정다면체의 면은 정삼각형·정사각형·정오각형뿐 (정육각형 3개를 모으면 360°라 입체가 안 됨).','구는 어느 방향으로 잘라도 단면이 원이다.','회전축을 포함한 단면의 넓이: 원기둥은 2r × h, 원뿔은 '+fr(1,2)+' × 2r × h.'],
 ex:[{t:'모서리가 18개인 각기둥의 면과 꼭짓점의 개수',a:'3n = 18 → n = 6 → 육각기둥<br>면 6 + 2 = <b>8개</b>, 꼭짓점 2 × 6 = <b>12개</b>'},
  {t:'밑면의 반지름 4 cm, 높이 6 cm인 원뿔을 회전축을 포함하는 평면으로 자른 단면의 넓이',fig:()=>figCone('4cm','6cm',false),a:`단면은 밑변 8 cm, 높이 6 cm인 이등변삼각형<br>${fr(1,2)} × 8 × 6 = <b>24 cm²</b>`}],
 go:['c1-cnt','c1-inv','c1-reg','c1-rot','c1-sec']},
{id:'N-D1',u:'D1',title:'대푯값 · 줄기와 잎 그림',

  `최빈값: ${F('가장 많이 나타나는 값')} (2개 이상일 수도, 숫자가 아닌 자료에도 쓸 수 있음)`,`줄기와 잎 그림: 줄기는 ${F('십의 자리')}, 잎은 ${F('일의 자리')} / 잎은 중복되어도 모두 쓰고, ${F('잎의 총 개수 = 자료의 개수')}`],

function nsGr(f){const O=[80,56],u=5.5,X=x=>f1(O[0]+x*u),Y=y=>f1(O[1]-y*u);let s=`<path class="ln" style="stroke-width:1" d="M8 ${O[1]}H152M${O[0]} 6V106"/>${txt('x',150,O[1]-4,'end','v')}${txt('y',O[0]+5,14,'','v')}${txt('O',O[0]-4,O[1]+13,'end','v')}`,d='',pen=false;

  <div class="list" style="margin-top:8px">${list.length?list.map((r,ix)=>{const t=TYPE[r.id],im=ims[ix];return `<div class="row"><div class="t" style="display:flex;gap:10px;align-items:center"><img src="${im}" alt="" style="width:92px;height:${Math.round(92*(r.h||420)/1000)}px;border:1px solid var(--rule);border-radius:6px;background:#fff"><div><b>${t.name}</b><p>${SUBNAME[t.u]} · ${new Date(r.at).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})} · ${r.ok==null?'채점 전':r.ok?'맞힘':'틀림'}${r.ok!=null?(r.help>0?' · 💡도움받음('+HELP_NAME[r.help]+')':' · ✅혼자 풀었어요'):''}${r.help>=2&&r.ok?' · 복습 필요':''}${r.rate?' · '+PL_RATE.find(x=>x[0]===r.rate)[1]:''}</p></div></div><div class="acts"><button class="btn sm" data-pl="o|0" data-k="${r.k}">확인</button></div></div>`}).join(''):'<div class="empty" style="margin:8px 0">해당하는 풀이가 없습니다.</div>'}</div>`:'<p class="muted" style="margin:8px 0 0">풀이 칸(수학·과학·기술가정 문제 아래)에 쓴 풀이가 여기에 자동으로 모여, 정답 풀이와 나란히 확인할 수 있습니다.</p>'}</div>`}
function plogDetail(r,im){const t=TYPE[r.id],d=gen(r.id,r.seed),E=aiEsc,ai=d.opts.indexOf(d.ans);
 return `<div class="scope"><div class="bar"><b>${t.name}</b><span class="muted">${SUBNAME[t.u]} · ${new Date(r.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'})} · ${r.ok==null?'채점 전':r.ok?'맞힘':'틀림'} · ${r.help>0?'💡 도움받아 풀었어요('+HELP_NAME[r.help]+'까지)':'✅ 혼자 풀었어요'}</span><span class="sp"></span><button class="btn sm" data-pl="c|0">목록</button></div>
  <h3 class="mbh">문제</h3><div class="qt">${d.q}</div>${d.fig?`<figure class="fig">${d.fig}</figure>`:''}${d.sa?'':`<ol class="opts" style="margin-top:6px">${d.opts.map((o,i)=>`<li class="opt${i===ai?' ok':''}" style="cursor:default"><span class="bub">${i+1}</span><span>${o}</span>${i===ai?'<span class="mk">정답</span>':''}</li>`).join('')}</ol>`}
  <h3 class="mbh">아이가 쓴 풀이</h3><div class="bar" style="gap:6px;margin-bottom:6px"><button class="chip${PL.light?' on':''}" data-pl="light|0">흰 배경(인쇄용)으로 보기</button><button class="btn sm" data-pl="save|0">이미지로 저장</button></div><img src="${im}" alt="아이의 풀이" style="width:100%;border:1px solid var(--rule);border-radius:8px;background:#fff">
  <h3 class="mbh">정답 · 모범 풀이</h3><div class="exp"><b class="h">정답 ${CIRC[ai]??''} · 풀이</b>${d.exp}</div>
  <h3 class="mbh">부모 확인</h3><div class="bar" style="gap:6px">${PL_RATE.map(([k,n])=>`<button class="chip${r.rate===k?' on':''}" data-pl="r|${k}">${n}</button>`).join('')}</div>
  <textarea class="satx" id="plMemo" rows="2" placeholder="메모 (예: 3단계에서 부호 실수)">${E(r.memo||'')}</textarea>
  ${mbOn()?`<div class="bar" style="margin-top:6px"><button class="btn pri sm" data-pl="ai|0" ${PL.busy?'disabled':''}>AI로 풀이 비교하기</button><span class="muted">모범 풀이와 얼마나 같은지, 틀린 단계는 어디인지 알려줘요</span></div>`:''}
  ${PL.busy?'<p class="aimsg t think" style="margin:8px 0 0">풀이를 비교하는 중이에요…</p>':''}${PL.err?`<p class="ainote">${E(PL.err)}</p>`:''}${r.ai?`<div class="aimsg t" style="margin-top:8px"><b>AI 풀이 비교</b><br>${aiFmt(r.ai)}</div>`:''}
  <div class="bar" style="margin-top:10px"><button class="btn sm" data-pl="again|0">같은 문제 다시 풀기</button><button class="btn sm" data-pl="del|0">풀이 삭제</button></div></div>`}
async function plogSave(){const k=PL.open;const r=PADS.get(k)||await padGet(k);if(!r)return;const cv=await padCanvasA(r,false);   /* 저장 이미지는 항상 흰 바탕 + 진한 글씨(프린트용) */
 const blob=await new Promise(res=>cv.toBlob(res,'image/png'));const name=`풀이_${(TYPE[r.id]||{}).name||r.id}_${new Date(r.at).toISOString().slice(0,10)}.png`.replace(/[\\/:*?"<>|]/g,'');
 try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='cancelled')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function plogAI(k){const r=PADS.get(k)||await padGet(k);if(!r||!SAMPLE||PL.busy)return;PL.busy=true;PL.err='';plogRender();
 try{const d=gen(r.id,r.seed),imgs=[];if(d.fig&&AI_IMG){const div=document.createElement('div');div.innerHTML=d.fig;const sv=div.querySelector('svg');if(sv){const b=await aiSvgBlob(sv);if(b)imgs.push(b)}}
  const pb=await padBlob(r);if(pb)imgs.push(pb);
  const msg=`${AI_RULES}\n\n지금은 학부모가 아이의 손글씨 풀이를 확인하려는 상황이에요. 아래 [학생 풀이 이미지](마지막 이미지)를 [모범 풀이]와 비교해서 다음 형식으로 답해요.\n1. **풀이 일치도: N%** (핵심 단계가 모범 풀이와 얼마나 같은지, 한 줄 근거)\n2. 맞게 쓴 단계\n3. 빠졌거나 틀린 단계(어디서 어떻게 틀렸는지)\n4. 학부모를 위한 한 줄 총평\n글씨가 읽히지 않는 부분은 솔직히 말하고, 다른 방법으로 맞게 풀었다면 인정해요.\n\n과목: ${SJ[CUR].name}\n[문제]\n${aiTxt((()=>{const x=document.createElement('div');x.innerHTML=d.q;return x})())}${d.opts.length?'\n[보기]\n'+d.opts.map((o,i)=>`${CIRC[i]} ${aiTxt((()=>{const x=document.createElement('div');x.innerHTML=o;return x})())}`).join('\n'):''}\n\n[정답·모범 풀이]\n정답 ${CIRC[d.opts.indexOf(d.ans)]??''}\n${aiTxt((()=>{const x=document.createElement('div');x.innerHTML=d.exp;return x})())}\n\n[학생 상태]\n${r.ok==null?'채점 전':r.ok?'정답을 맞힘':'정답을 틀림'}`;
  const res=await SAMPLE([{role:'user',content:msg}],{images:imgs,cache:false});r.ai=res.text;const m=PADS.get(k)||r;m.ai=res.text;PADS.set(k,m);padPut(m)}
 catch(e){PL.err=(e&&e.code&&AI_ERR[e.code])||'AI 비교를 하지 못했어요. 다시 시도해 주세요.'}
 finally{PL.busy=false;plogRender()}}
$('#v-review').addEventListener('click',e=>{const b=e.target.closest('[data-pl]');if(!b)return;const[a,v]=b.dataset.pl.split('|');e.stopPropagation();
 if(a==='f'){PL.filter=v;plogRender();return}
 if(a==='o'){PL.open=b.dataset.k;PL.err='';plogRender();return}
 if(a==='c'){PL.open=null;plogRender();return}
 if(a==='light'){PL.light=!PL.light;plogRender();return}
 if(a==='save'){plogSave();return}
 const k=PL.open;if(!k)return;
 (async()=>{let r=PADS.get(k)||await padGet(k);if(!r)return;if(!PADS.has(k)){r.redo=[];PADS.set(k,r)}
  if(a==='r'){r.rate=r.rate===v?null:v;padPut(r);plogRender()}
  else if(a==='ai')plogAI(k)
  else if(a==='again'){newPractice(r.id,r.seed);show('practice')}
  else if(a==='del'){PADS.delete(k);await padDel(k);PL.open=null;plogRender()}})()},true);
$('#v-review').addEventListener('change',e=>{if(e.target.id!=='plMemo'||!PL.open)return;const k=PL.open,v=e.target.value;(async()=>{const r=PADS.get(k)||await padGet(k);if(r){r.memo=v;if(!PADS.has(k)){r.redo=[];PADS.set(k,r)}padPut(r)}})()});

</script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
/* ===== 기기 간 기록 공유 (Firebase · SRF 앱과 같은 방식) =====
   각 기기는 자기 기록만 exam_bank/rec_<과목> 문서의 d_<기기ID> 칸에 올리고,
   화면에는 모든 기기의 기록을 합쳐 보여 준다. 연결이 안 되면 이 기기 기록만으로 동작한다. */
const FB_CONFIG={"apiKey": "AIzaSyDU5MJI2w8AYazPxyzukE1lWAzLXOFfr7o", "authDomain": "rosegarden-4937c.firebaseapp.com", "projectId": "rosegarden-4937c", "storageBucket": "rosegarden-4937c.firebasestorage.app", "messagingSenderId": "109165303238", "appId": "1:109165303238:web:db2401090c9e79a5be8ec7"};
const FB_COL='exam_bank';
let fdb=null,REMOTE={},syncState='연결 중…',pushTimer=null;
let DEV=LS.get('m12-dev',null);if(!DEV){DEV=Math.random().toString(36).slice(2,10);LS.set('m12-dev',DEV)}
const devName=()=>($('#nm').value||'').trim()||'이름 없는 기기';
function merged(){const R=REMOTE[SK()]||{},t={},w=[];
 const addS=(x)=>{if(!x)return;for(const id in x.t||{}){const a=t[id]||(t[id]=[0,0]);a[0]+=x.t[id][0];a[1]+=x.t[id][1]}(x.w||[]).forEach(e=>w.push(e))};
 addS(S);Object.values(R).forEach(d=>addS(d.S));
 const seen=new Set();const ww=w.sort((a,b)=>b.at-a.at).filter(e=>{const k=e.id+':'+e.seed;if(seen.has(k))return false;seen.add(k);return true}).slice(0,80);
 return{t,w:ww}}
allS=merged;
esRecAll=()=>{const mine=LS.get(esKey(),{}),out={},add=r=>{for(const id in r||{}){const x=r[id],o=out[id]||(out[id]=[0,0,0]);o[0]+=x[0];if((x[2]||0)>=o[2]){o[1]=x[1];o[2]=x[2]||0}}};add(mine);Object.values(REMOTE[SK()]||{}).forEach(d=>add(d.E));return out};
function rerenderShared(){if(!$('#v-stats').hidden)renderStats();if(!$('#v-review').hidden)renderReview();if(!$('#v-essay').hidden)renderEssay()}
async function pull(subj){if(!fdb)return;try{const doc=await fdb.collection(FB_COL).doc('rec_'+subj).get();const data=doc.exists?doc.data():{};const r={};
 for(const k in data){if(!k.startsWith('d_')||k==='d_'+DEV)continue;try{r[k.slice(2)]=JSON.parse(data[k])}catch(e){}}
 REMOTE[subj]=r;syncState='연결됨';if(subj===SK())rerenderShared()}catch(e){syncState='연결 안 됨 (이 기기 기록만 표시)';rerenderShared()}}
function push(){if(!fdb)return;clearTimeout(pushTimer);const subj=SK(),payload=JSON.stringify({name:devName(),S,E:LS.get(esKey(),{}),at:Date.now()});
 pushTimer=setTimeout(()=>{fdb.collection(FB_COL).doc('rec_'+subj).set({['d_'+DEV]:payload},{merge:true}).then(()=>{syncState='연결됨'}).catch(()=>{syncState='연결 안 됨 (이 기기 기록만 표시)'})},800)}
onRecord=push;onSubject=(id)=>pull(SK(id));
statsExtra=()=>{const R=REMOTE[SK()]||{};const mine=Object.values(S.t).reduce((a,x)=>a+x[0],0);
 const others=Object.values(R).map(d=>`<div class="row"><div class="t"><b>${(d.name||'다른 기기').replace(/</g,'&lt;')}</b><p>마지막 풀이 ${new Date(d.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p></div><div class="num">${Object.values(d.S.t||{}).reduce((a,x)=>a+x[0],0)}문제</div></div>`).join('');
 return `<div class="list" style="margin-bottom:12px"><div class="row"><div class="t"><b>함께 보는 기록 · ${syncState}</b><p>아래 단원 현황과 오답노트는 모든 기기의 기록을 합친 것입니다.</p></div><div class="acts"><button class="btn sm" data-act="sync">새로고침</button></div></div>
 <div class="row"><div class="t"><b>이 기기 (${devName().replace(/</g,'&lt;')})</b><p>이름 칸에 아이 이름을 적어 두면 구분하기 쉽습니다.</p></div><div class="num">${mine}문제</div></div>${others}</div>`};
$('#v-stats').addEventListener('click',e=>{if(e.target.closest('[data-act="sync"]')){syncState='불러오는 중…';renderStats();pull(SK())}});
$('#nm').addEventListener('change',push);
(function init(){try{if(!window.firebase||!firebase.firestore){syncState='연결 안 됨 (이 기기 기록만 표시)';return}
 if(!firebase.apps.length)firebase.initializeApp(FB_CONFIG);fdb=firebase.firestore();pull(SK());setInterval(()=>pull(SK()),5*60*1000)}catch(e){syncState='연결 안 됨 (이 기기 기록만 표시)'}})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull(SK())});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
